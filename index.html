/* Theme Biru Paaxixi — judul berjenjang dan fokus keyboard yang jelas */
.page-title{line-height:1.2}
.card-head h3,.section-header h2{line-height:1.38}
.table input[data-rupiah]{width:125px;max-width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--text);background:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #4f8af6;outline-offset:2px}
::selection{background:#c8dcff;color:#142e55}
.brand-avatar{width:43px;height:43px;object-fit:cover;display:block;border:2px solid #dbe9ff;border-radius:12px;background:#fff;flex:none}
.welcome-panel{background:linear-gradient(120deg,#102a4e 0%,#173d6c 65%,#235aa0 100%);color:#fff;border-radius:19px;padding:18px 23px;display:flex;align-items:center;gap:22px;margin:12px 0 20px;box-shadow:0 14px 36px rgba(16,42,78,.12);border:1px solid #2d527f}
.welcome-avatar{width:100px;height:100px;object-fit:contain;background:#fff;border-radius:17px;padding:4px;flex:none}

.welcome-panel p{margin:0;color:#deebff;font-size:13px;line-height:1.6}
.welcome-eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#b5d4ff;font-weight:800;margin-bottom:5px}

.welcome-quote{color:#deebff;font-size:14px;font-weight:500;line-height:1.6;margin:4px 0 0}
@media(max-width:520px){.welcome-quote{font-size:12px;line-height:1.5}.welcome-eyebrow{letter-spacing:.25px;line-height:1.4}}

.symbol-line{display:inline-flex;align-items:center;gap:9px;min-width:0;vertical-align:middle}
.symbol-line .symbol-text{min-width:0}
.alert-item .category-symbol{background:transparent;width:28px;height:28px;font-size:21px}

.comp-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.comp-fields label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:12px;color:#435a7b}
.comp-fields input,.comp-fields select{border:1px solid #d1dff0;border-radius:10px;background:white;color:var(--text);padding:10px;min-width:0;width:100%;font:inherit}
.comp-choice{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.comp-choice details{flex:1;min-width:175px;background:#fff;border:1px solid #d6e3f6;border-radius:11px;padding:9px 11px}
.comp-choice summary{cursor:pointer;font-size:12px;font-weight:750;list-style:revert}
.comp-checks{max-height:180px;overflow-y:auto;padding-top:7px}
.comp-checks label{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:12px}
.comp-checks input{accent-color:#2563eb;width:15px;height:15px}
.comp-tiny{color:#71849d;font-size:11px;margin:9px 0 0;line-height:1.5}
.comp-summary{color:#6a82a4;font-size:12px;margin:4px 0 0}
.comp-empty{padding:18px;text-align:center;color:#71849d;font-size:13px}
.comp-donut-legend{max-height:305px;overflow-y:auto;padding-right:3px}
.comp-legend-row{display:flex;align-items:center;justify-content:space-between;gap:9px}
.comp-insight{margin-top:15px}
.trend-panel{margin:16px 0 18px}
.trend-settings{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.trend-settings label{font-size:12px;font-weight:750;color:#607699}
.trend-settings select{font:inherit;padding:8px 11px;background:white;color:var(--text);border:1px solid #dae6f8;border-radius:10px}
.trend-scroll{width:100%;overflow-x:auto;padding:6px 0 10px}
.trend-graph{min-width:540px;display:flex;align-items:flex-end;gap:10px;padding:8px 3px 2px;border-bottom:1px solid #dce7f7}
.trend-column{min-width:0;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.trend-bars{height:155px;width:min(100%,56px);display:flex;align-items:flex-end;justify-content:center;position:relative}
.trend-stack{width:100%;display:flex;flex-direction:column-reverse;overflow:hidden;border-radius:7px 7px 0 0;min-height:2px}
.trend-block{flex:none;min-height:0}
.trend-no-data{width:100%;height:3px;background:#e5eefa;border-radius:5px}
.trend-column strong{font-size:11px;color:#253e69;white-space:nowrap}
.trend-column small{font-size:11px;color:#7790ae}
.trend-keys{display:flex;gap:8px 18px;flex-wrap:wrap;margin:12px 0}
.trend-key{display:flex;align-items:center;gap:7px;font-size:12px;color:#50688b}
.trend-key .dot{flex:none}
.trend-notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}
.trend-note{background:#f3f7ff;padding:13px;border:1px solid #e0eafa;border-radius:13px;font-size:12px;color:#314e75;line-height:1.55}
.trend-note strong{display:block;font-size:13px;color:#173d6c;margin-bottom:5px}
.trend-table-wrap{overflow-x:auto;margin-top:9px}
.trend-table{width:100%;border-collapse:collapse;font-size:12px}
.trend-table th,.trend-table td{text-align:left;white-space:nowrap;padding:10px 11px;border-bottom:1px solid #e5edf8}
.trend-table th{color:#627b9d;font-weight:800}
.trend-table td:last-child,.trend-table th:last-child{text-align:right}
.trend-up{color:#b94b35;font-weight:750}
.trend-down{color:#14836f;font-weight:750}
@media(max-width:640px){.comp-fields,.trend-notes{grid-template-columns:1fr}.comp-filter-toggle{padding:7px 9px;font-size:11px}.trend-panel{margin-top:15px}.comp-controls{padding:11px}}

/* Filter berurutan: periode → kelompok → pos → tampilan */
.comp-controls{display:flex;flex-direction:column;gap:11px}
.comp-stage{display:flex;gap:11px;border:1px solid #dce8fa;background:#fff;border-radius:13px;padding:12px}
.comp-step{display:grid;place-items:center;flex:none;width:25px;height:25px;border-radius:50%;background:#2563eb;color:#fff;font-size:12px;font-weight:800}
.comp-stage-body{flex:1;min-width:0}
.comp-stage h4{font-size:13px;font-weight:800;color:#163c73;margin:3px 0 8px}
.comp-stage .comp-tiny{margin:0 0 9px}
.comp-stage details{border:1px solid #dbe6f7;border-radius:9px;padding:9px 11px;background:#f7faff}
.comp-stage summary{cursor:pointer;font-size:12px;font-weight:700;color:#203e6c}
.comp-check-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));max-height:225px;gap:2px 12px}
.comp-check-grid label{min-width:0;display:flex;align-items:flex-start;gap:8px}
.comp-check-grid label>span{min-width:0;overflow-wrap:anywhere;line-height:1.4}
.comp-check-grid small{display:block;font-size:10px;color:#71849d}
.comp-list-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.comp-list-actions .btn:disabled{opacity:.48;cursor:not-allowed}
.comp-stage .comp-fields{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}

/* Line chart & rentang harian, bulanan, tahunan */
.trend-range-filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:8px 0 12px}
.trend-range-filters label{display:flex;flex-direction:column;gap:7px;color:#466081;font-size:12px;font-weight:750}
.trend-range-filters select,.trend-range-filters input{background:#fff;border:1px solid #cedff4;border-radius:10px;font:inherit;min-width:0;width:100%;padding:10px;color:#193c71}
.trend-range-actions{display:flex;align-items:flex-end;grid-column:1/-1}
.trend-label-toggle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 12px}
.trend-label-toggle label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#1e437b}
.trend-label-toggle input{accent-color:#2563eb;width:16px;height:16px}
.trend-line-legend{display:flex;flex-wrap:wrap;gap:9px 18px;margin:5px 0 18px}
.trend-line-key{display:inline-flex;gap:7px;align-items:center;color:#526d91;font-size:12px}
.trend-line-key i{height:3px;width:23px;border-radius:3px;display:inline-block}
.trend-data-details{margin-top:12px;border:1px solid #e0eafa;padding:12px;border-radius:12px}
.trend-data-details summary{cursor:pointer;color:#1a4686;font-size:12px;font-weight:800}
.trend-data-details[open] summary{margin-bottom:12px}
@media(max-width:720px){.trend-range-filters{grid-template-columns:repeat(2,minmax(0,1fr))}.trend-range-filters label:first-child{grid-column:1/-1}}

/* #014 Filter ringkas dengan menu pilihan pop-up berlapis; tidak meregangkan kartu. */
#composition-card:has(.comp-picker.is-open){position:relative;z-index:30;overflow:visible}
.comp-dashboard-grid{isolation:isolate}
.comp-controls-compact{overflow:visible;padding:12px;position:relative}
.comp-compact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,195px));gap:10px 12px;align-items:end}
.comp-compact-field{display:flex;flex-direction:column;gap:5px;position:relative;min-width:0}
.comp-compact-label{font-size:11px;font-weight:750;color:#456287;line-height:1.25}
.comp-compact-field select,.comp-compact-field input,.comp-popup-trigger{box-sizing:border-box;width:100%;min-width:0;height:37px;border:1px solid #cbdbf1;border-radius:9px;background:#fff;padding:0 11px;color:#173e72;font:inherit;font-size:12px}
.comp-popup-trigger{display:flex;align-items:center;justify-content:space-between;gap:7px;cursor:pointer;text-align:left}
.comp-popup-trigger:hover,.comp-popup-trigger[aria-expanded="true"]{border-color:#639bef;background:#f8fbff}
.comp-popup-trigger:disabled{opacity:.56;cursor:not-allowed}
.comp-trigger-value{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:750}
.comp-chevron{font-size:19px;line-height:1;color:#7892b7}
.comp-picker.is-open{z-index:70}
.comp-popover{position:absolute;z-index:100;top:calc(100% + 7px);left:0;width:min(282px,calc(100vw - 64px));box-sizing:border-box;display:flex;flex-direction:column;max-height:calc(100dvh - 24px);background:#fff;border:1px solid #cbdcf5;border-radius:13px;box-shadow:0 14px 38px rgba(19,46,91,.19);padding:0;animation:comp-pop-in .12s ease-out}
.comp-popover.flip-up{top:auto;bottom:calc(100% + 7px)}
.comp-popover-header,.comp-popover-actions,.comp-popover-foot{flex:none}
.comp-picker:nth-child(3) .comp-popover{left:auto;right:0}
@keyframes comp-pop-in{from{opacity:.6;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.comp-popover-header{display:flex;justify-content:space-between;align-items:center;padding:11px 12px 7px;color:#173e72;font-size:12px}
.comp-popup-close{border:0;background:#edf3ff;border-radius:7px;color:#4b638b;cursor:pointer;width:25px;height:25px}
.comp-popover-actions{display:flex;gap:7px;padding:0 12px 9px}
.comp-popover-actions button{font:inherit;font-size:11px;font-weight:750;padding:6px 9px;border:1px solid #d9e6f8;color:#265ab1;background:#f5f9ff;border-radius:7px;cursor:pointer}
.comp-popover-actions button:hover{background:#e6f0ff}
.comp-popover-items{overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0;max-height:210px;padding:0 10px 4px}
.comp-popitem{display:flex;align-items:flex-start;gap:8px;padding:8px 6px;border-radius:7px;cursor:pointer;font-size:12px;color:#243d61;line-height:1.35}
.comp-popitem:hover{background:#eff5ff}
.comp-popitem input{flex:none;width:15px;height:15px;accent-color:#2563eb;cursor:pointer;margin-top:1px}
.comp-popitem span{min-width:0;overflow-wrap:anywhere}
.comp-popitem small{display:block;color:#7b91ad;font-size:10px;margin-top:2px}
.comp-popover-empty{font-size:12px;color:#71849d;padding:12px}
.comp-popover-foot{border-top:1px solid #e5ecf7;padding:8px 12px;font-size:10px;color:#71849d;line-height:1.4}
.comp-compact-dates{display:grid;grid-template-columns:repeat(2,minmax(0,195px));gap:10px 12px;margin-top:11px}
.comp-compact-bottom{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:11px;font-size:10px;color:#7d8fa8}
.comp-compact-reset{border:0;background:transparent;color:#265ab1;cursor:pointer;font:inherit;font-size:11px;font-weight:750;padding:3px 0}
.comp-compact-reset:hover{text-decoration:underline}
@media(max-width:550px){.comp-compact-grid,.comp-compact-dates{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.comp-controls-compact{padding:10px}.comp-popover{width:min(282px,calc(100vw - 48px))}.comp-compact-field select,.comp-compact-field input,.comp-popup-trigger{padding:0 8px}}
@media(prefers-reduced-motion:reduce){.comp-popover{animation:none}}
/* Popup sambutan setiap buka/refresh situs; tutup hanya sampai halaman dimuat ulang. */
.welcome-modal-backdrop{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:clamp(14px,4vw,32px);background:rgba(9,25,48,.64);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);overflow-y:auto}
.welcome-modal{position:relative;width:min(820px,100%);margin:auto;box-shadow:0 26px 74px rgba(5,23,51,.38);border-radius:20px}
.welcome-modal .welcome-panel{margin:0;padding:32px 68px 32px 28px;border-radius:20px;min-height:180px;box-shadow:none}
.welcome-modal .welcome-avatar{width:110px;height:110px}
.welcome-modal .welcome-copy h2{font-size:clamp(22px,3vw,29px)}
.welcome-modal .welcome-quote{font-size:15px;line-height:1.6}
.welcome-modal-close{position:absolute;z-index:2;top:13px;right:13px;display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(255,255,255,.25);border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:17px;line-height:1;cursor:pointer;transition:background .15s}
.welcome-modal-close:hover{background:rgba(255,255,255,.27)}
.welcome-modal-close:focus-visible{outline:3px solid #fff;outline-offset:2px}
body:has(.welcome-modal-backdrop){overflow:hidden}
@media(max-width:600px){.welcome-modal .welcome-panel{flex-direction:column;align-items:flex-start;gap:15px;padding:22px 20px 24px;min-height:0}.welcome-modal .welcome-avatar{width:82px;height:82px}.welcome-modal .welcome-copy h2{font-size:22px}.welcome-modal .welcome-quote{font-size:13px}.welcome-modal .welcome-eyebrow{padding-right:12px}.welcome-modal-close{top:12px;right:12px}}
@media print{.welcome-modal-backdrop{display:none!important}}

/* Notifikasi validasi tetap berada di atas modal formulir. */
.toast{z-index:1200}
/* Modal ringkas untuk Tambah/Edit Pos serta Kelompok Pengeluaran */
.finance-editor-backdrop{position:fixed;inset:0;z-index:1100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(9,27,57,.57);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow-y:auto}
.finance-editor-dialog{width:min(430px,100%);max-height:min(620px,calc(100dvh - 32px));overflow-y:auto;margin:auto;background:#fff;border:1px solid #dce8fb;border-radius:19px;box-shadow:0 24px 70px rgba(9,36,71,.29);color:var(--text)}
.finance-editor-heading{padding:20px 19px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e6eef9}
.finance-editor-symbol{display:grid;place-items:center;flex:none;width:45px;height:45px;border-radius:13px;background:#eaf2ff;font-size:23px}
.finance-editor-heading h3{font-size:18px;font-weight:800;margin:0 0 4px}
.finance-editor-heading p{font-size:12px;line-height:1.4;color:#6f83a1;margin:0}
.finance-editor-heading>div:nth-child(2){flex:1;min-width:0}
.finance-editor-close{border:0;background:#f0f5fd;border-radius:8px;flex:none;cursor:pointer;width:30px;height:30px;color:#516b91;font-size:16px}
.finance-editor-close:hover{background:#e0ebfd}
.finance-editor-form{display:flex;flex-direction:column;gap:14px;padding:18px 19px 20px}
.editor-field{display:flex;flex-direction:column;gap:7px;color:#315078;font-size:12px;font-weight:750}
.editor-field .field{width:100%;min-width:0;height:42px;box-sizing:border-box}
.editor-color-field{display:flex;align-items:center;gap:12px;padding:8px 11px;border:1px solid #dbe6f7;border-radius:11px;font-size:12px;font-weight:500;color:#7086a4}
.editor-color-field input{border:0;padding:0;background:transparent;width:42px;height:32px;cursor:pointer}
.finance-editor-actions{display:flex;align-items:center;justify-content:flex-end;gap:9px;margin-top:6px}
.finance-editor-actions .btn{font-size:12px}
.finance-editor-dialog :is(input,select,button):focus-visible{outline:2px solid #2d68dd;outline-offset:2px}
body:has(.finance-editor-backdrop){overflow:hidden}
@media(max-width:520px){.finance-editor-backdrop{padding:12px}.finance-editor-heading{padding:16px 15px 13px}.finance-editor-form{padding:15px;gap:13px}.finance-editor-dialog{border-radius:16px}.finance-editor-actions .btn{padding:9px 11px}}
@media(prefers-reduced-motion:reduce){.finance-editor-backdrop{backdrop-filter:none}}

/* Palet 5 warna tetap: konsisten navy, tanpa input HEX atau pemilih warna bebas */
.finance-color-set{margin:0;padding:0;border:0;min-width:0}
.finance-color-set legend{display:block;color:#315078;font-size:12px;font-weight:750;padding:0;margin-bottom:10px}
.finance-color-set legend small{color:#8293ad;font-size:11px;font-weight:500}
.finance-color-options{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.finance-color-option{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;min-width:0;border:1px solid #e2eaf8;border-radius:12px;padding:9px 4px 7px;background:#f8fbff;transition:border-color .15s,background .15s,transform .15s}
.finance-color-option:hover{border-color:#a8c4f2;background:#eff5ff}
.finance-color-option input{position:absolute;width:100%;height:100%;inset:0;margin:0;opacity:0;cursor:pointer}
.finance-color-option input:focus-visible+.finance-color-swatch{outline:3px solid #164ea7;outline-offset:3px}
.finance-color-option:has(input:checked){border-color:#2b65cf;background:#eaf2ff;box-shadow:0 0 0 1px #2b65cf}
.finance-color-swatch{width:34px;height:34px;display:grid;place-items:center;background:var(--swatch);border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 1px 5px #173d7020;pointer-events:none}
.finance-color-check{color:#fff;font-size:16px;font-weight:900;opacity:0;text-shadow:0 1px 2px #0005;pointer-events:none}
.finance-color-option input:checked+.finance-color-swatch .finance-color-check{opacity:1}
.finance-color-name{font-size:10px;font-weight:650;color:#52698d;line-height:1.3;text-align:center;pointer-events:none}
.finance-color-help{margin:10px 0 0;font-size:11px;color:#7185a4;line-height:1.45}
@media(max-width:430px){.finance-color-options{gap:5px}.finance-color-option{padding:9px 2px 7px}.finance-color-swatch{width:28px;height:28px}.finance-color-name{font-size:10px}}

/* Tinjau Pengeluaran: grafik horizontal yang bisa dipilih dan batas anggaran. */
.review-visual-list{display:grid;gap:9px;margin-top:12px}
.review-bar-select{display:grid;grid-template-columns:minmax(145px,220px) minmax(140px,1fr) minmax(115px,auto);align-items:center;gap:14px;width:100%;padding:13px 15px;border:1px solid #e0e9f8;border-radius:13px;background:#fff;color:var(--text);text-align:left;font:inherit;cursor:pointer}
.review-bar-select:hover{background:#f7fbff;border-color:#92b3e9}
.review-bar-select[aria-pressed="true"]{background:#f0f6ff;border-color:#2563eb;box-shadow:inset 0 0 0 1px #2563eb}
.review-bar-pos{display:flex;align-items:center;gap:9px;min-width:0}
.review-bar-pos strong{display:block;font-size:13px;overflow-wrap:anywhere}
.review-bar-pos small{display:block;margin-top:3px;font-size:11px;color:var(--muted)}
.review-bar-area{display:block;min-width:0}
.review-bar-track{display:block;position:relative;height:19px;background:#e9f0fa;border-radius:10px;overflow:hidden}
.review-bar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--bar-color);border-radius:10px}
.review-bar-marker{position:absolute;top:0;bottom:0;width:3px;background:#122a4c;transform:translateX(-1.5px);z-index:1}
.review-bar-caption{display:block;color:#7186a4;font-size:11px;margin-top:5px}
.review-bar-numbers{display:flex;flex-direction:column;align-items:flex-end;gap:5px;white-space:nowrap}
.review-bar-numbers strong{font-size:15px;color:#173d70}
.review-bar-badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#eff5fe;color:#3266a7;font-weight:750;font-size:10px}
.review-bar-badge.warn{background:#fff3dc;color:#976411}
.review-bar-badge.danger{background:#ffe9e9;color:#b63745}
.review-bar-badge.unset{background:#f0f2f6;color:#6d798c}
.review-chart-legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;margin:0 0 16px;color:#647b9b;font-size:11px}
.review-chart-legend span{display:inline-flex;align-items:center;gap:6px}
.review-legend-block{display:inline-block;width:16px;height:10px;background:#2563eb;border-radius:4px}
.review-legend-marker{display:inline-block;height:16px;border-left:3px solid #122a4c}
.review-detail-card{margin-top:18px;border:1px solid #dde9f8;border-radius:15px;overflow:hidden;background:#f9fbff}
.review-detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid #dde9f8}
.review-detail-head h4{margin:0 0 3px;font-size:15px}
.review-detail-head p{margin:0;font-size:12px;color:var(--muted)}
.review-detail-card .review-item{background:#fff}
.review-detail-card .review-item:last-child{border-radius:0 0 15px 15px}
.review-chart-note{color:#7286a0;font-size:11px;margin:10px 0}
@media(max-width:730px){
 .review-bar-select{grid-template-columns:minmax(0,1fr) auto;gap:9px;padding:12px}
 .review-bar-pos{grid-column:1;grid-row:1}
 .review-bar-numbers{grid-column:2;grid-row:1}
 .review-bar-area{grid-column:1/-1;grid-row:2}
 .review-detail-card .review-item{flex-wrap:wrap}
}

/* #023 Tinjau Pengeluaran: kalender harian, satu grafik, rincian dalam modal. */
.review-visual-panel{border:1px solid #dce8fa;border-radius:17px;background:#f9fbff;padding:17px;margin-top:14px}
.review-visual-panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.review-visual-panel-head h4{margin:0;font-size:16px;color:#173c70}
.review-visual-panel-head p{margin:4px 0 0;font-size:12px;color:#7184a1}
.review-visual-panel .review-visual-list{margin:0}
.review-cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin:0 0 7px}
.review-cal-head span{text-align:center;font-weight:750;font-size:12px;color:#5b7497;padding:5px 0}
.review-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.review-cal-spacer{min-width:0;min-height:84px}
.review-cal-day{display:flex;flex-direction:column;align-items:flex-start;min-width:0;min-height:84px;padding:10px 9px;border:1px solid #e1eafa;border-radius:11px;background:#fff;color:#173a6c;text-align:left;font:inherit;cursor:pointer;gap:7px;transition:border-color .15s,background .15s}
.review-cal-day:hover{background:#eaf3ff;border-color:#8fb6ed}
.review-cal-day.has-expense{border-color:#c9dbfa;background:#f1f6ff}
.review-cal-day.is-today{box-shadow:inset 0 0 0 1px #4e84e8}
.review-cal-day .review-cal-number{font-size:13px;font-weight:850}
.review-cal-day .review-cal-total{font-size:11px;font-weight:800;color:#245cb7;line-height:1.3;overflow-wrap:anywhere}
.review-cal-day .review-cal-empty{font-size:10px;color:#a6b5ca}
.review-cal-day .review-cal-count{font-size:10px;color:#6f86a6}
.review-cal-foot{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;margin-top:14px;font-size:11px;color:#6f84a1}
.review-modal-backdrop{position:fixed;inset:0;z-index:1080;background:rgba(8,25,50,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:center;padding:16px}
.review-modal-dialog{width:min(720px,100%);max-height:min(82dvh,790px);display:flex;flex-direction:column;min-height:0;background:#fff;border-radius:18px;box-shadow:0 26px 75px #071e4052;overflow:hidden}
.review-modal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:19px 21px;border-bottom:1px solid #dfe9f8}
.review-modal-top h3{margin:0;color:#153c72;font-size:20px;line-height:1.3}
.review-modal-top p{margin:6px 0 0;color:#6c819f;font-size:12px}
.review-modal-close{flex:none;width:34px;height:34px;border:1px solid #dbe7f9;background:#f3f7ff;border-radius:9px;color:#315b96;cursor:pointer;font-size:17px}
.review-modal-close:hover{background:#e4efff}
.review-modal-content{overflow-y:auto;overscroll-behavior:contain;padding:2px 0 15px;min-height:0}
.review-modal-content .review-item{padding:15px 21px}
.review-modal-content .review-block{margin:12px 16px}
.review-modal-content .review-block .review-item{padding:12px 15px}
.review-modal-empty{padding:36px 20px;text-align:center;color:#7185a2;font-size:13px}
body:has(.review-modal-backdrop){overflow:hidden}
@media(max-width:640px){

/* #032 Logo doodle animasi: stiker Rp, efek tulisan tangan, per-huruf hopping. */
.paaxixi-doodle{
  position:relative;isolation:isolate;
  font-family:"Comic Sans MS","Segoe Print","Trebuchet MS",system-ui,cursive;
  font-weight:900;text-transform:none;letter-spacing:0;
}
.paaxixi-word{display:inline-flex;align-items:center;white-space:nowrap;line-height:1.22}
.paaxixi-letter{
  display:inline-block;position:relative;transform-origin:center 82%;
  transform:rotate(var(--paaxixi-angle,0deg));
  animation:paaxixi-letter-dance var(--paaxixi-duration,8s) ease-in-out var(--paaxixi-delay,0s) infinite;
  will-change:transform;
}
.paaxixi-doodle-sidebar{
  display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;
  width:max-content;max-width:145px;min-width:0;gap:0;padding:3px 9px 3px 1px;
  overflow:visible;
}
.paaxixi-doodle-sidebar .paaxixi-main-word{
  color:#fff;font-size:17px;font-weight:950;letter-spacing:-.7px;
  text-shadow:-1px 1px 0 #2f5b99,1px 2px 0 #17365e,2px 3px 0 #071e3b;
  -webkit-text-stroke:.25px #c8e1ff;
}
.paaxixi-doodle-sidebar .paaxixi-sub-word{
  margin-top:0;color:#addbff;font-size:15px;letter-spacing:.05px;
  text-shadow:1px 2px 0 #061d3d;
  text-decoration:underline;text-decoration-style:wavy;text-decoration-color:#ffd66a;
  text-decoration-thickness:1px;text-underline-offset:3px;
}
.paaxixi-flying-money{
  position:absolute;right:-11px;top:-13px;font-size:17px;line-height:1;
  animation:paaxixi-money-float 8.2s ease-in-out -1.8s infinite;
  pointer-events:none;
}
.paaxixi-side-star{
  position:absolute;right:-13px;bottom:-7px;color:#ffd86e;font-size:15px;
  text-shadow:0 1px 1px #102a4e;
  animation:paaxixi-spark 6.6s ease-in-out -2s infinite;pointer-events:none;
}
.paaxixi-doodle-kicker{
  display:inline-flex;flex-wrap:nowrap;align-items:center;gap:7px;
  width:max-content;max-width:100%;padding:5px 10px 5px 6px;margin:1px 0 5px;
  color:#2356a0!important;background:#e8f3ff;border:1.5px solid #b9d6ff;
  border-radius:12px 10px 13px 10px;box-shadow:2px 3px 0 #cee3ff;
  transform:rotate(-.65deg);
}
.paaxixi-doodle-kicker .paaxixi-word{
  font-size:13px;letter-spacing:-.5px;text-transform:none;
  text-shadow:1px 1px 0 #fff,-1px 0 0 #d9eaff;
}
.paaxixi-doodle-kicker .paaxixi-word:nth-of-type(3){color:#8061be}
.paaxixi-coin{
  display:grid;place-items:center;flex:none;width:24px;height:24px;
  border:1.5px dashed #fef0a7;border-radius:50%;
  color:#65410a;font:900 11px/1 "Trebuchet MS",system-ui,sans-serif;
  background:linear-gradient(145deg,#fff1a0,#f9bd50);
  box-shadow:1px 2px 0 #d9a33e;
  animation:paaxixi-coin-flip 9.4s ease-in-out -2s infinite;
}
.paaxixi-kicker-spark{
  flex:none;color:#e6ac2e;font-size:17px;line-height:1;
  animation:paaxixi-spark 5.7s ease-in-out -2.8s infinite;
}
@keyframes paaxixi-letter-dance{
  0%,67%,100%{transform:translateY(0) rotate(var(--paaxixi-angle,0deg)) scale(1)}
  71%{transform:translateY(-3px) rotate(calc(var(--paaxixi-angle,0deg) - 6deg)) scale(1.09)}
  75%{transform:translateY(0) rotate(calc(var(--paaxixi-angle,0deg) + 4deg)) scale(.98)}
  79%{transform:translateY(-1px) rotate(var(--paaxixi-angle,0deg)) scale(1.01)}
  83%{transform:translateY(0) rotate(var(--paaxixi-angle,0deg)) scale(1)}
}
@keyframes paaxixi-coin-flip{
  0%,72%,100%{transform:rotate(8deg) scale(1)}
  79%{transform:rotate(368deg) scale(1.08)}
  84%{transform:rotate(368deg) scale(1)}
}
@keyframes paaxixi-money-float{
  0%,68%,100%{transform:translate(0,0) rotate(-10deg)}
  77%{transform:translate(2px,-5px) rotate(13deg)}
  84%{transform:translate(-1px,-2px) rotate(-7deg)}
}
@keyframes paaxixi-spark{
  0%,68%,100%{opacity:.7;transform:scale(.8) rotate(0)}
  74%{opacity:1;transform:scale(1.3) rotate(35deg)}
  81%{opacity:.8;transform:scale(.88) rotate(7deg)}
}
@media(max-width:520px){
  .paaxixi-doodle-kicker{gap:5px;padding:4px 7px 4px 5px;margin-bottom:6px}
  .paaxixi-doodle-kicker .paaxixi-word{font-size:11.5px}
  .paaxixi-coin{width:21px;height:21px;font-size:10px}
  .paaxixi-kicker-spark{font-size:14px}
}
@media(prefers-reduced-motion:reduce){
  .paaxixi-doodle .paaxixi-letter,.paaxixi-flying-money,.paaxixi-side-star,
  .paaxixi-coin,.paaxixi-kicker-spark{animation:none!important;transform:none!important;will-change:auto}
}

/* #033 Dynamic icons + cashflow amount highlights (navy-friendly, staggered). */
.category-symbol{
 transform-origin:50% 75%;
 animation:paaxixi-symbol-hop 8.6s ease-in-out -1.4s infinite;
}
.review-group:nth-child(3n+1) .category-symbol,
.legend-row:nth-child(3n+1) .category-symbol,
.inline-line:nth-child(3n+1) .category-symbol{
 animation-duration:9.2s;animation-delay:-3.1s;
}
.review-group:nth-child(3n+2) .category-symbol,
.review-bar-select:nth-child(3n+2) .category-symbol,
.legend-row:nth-child(3n+2) .category-symbol,
.inline-line:nth-child(3n+2) .category-symbol{
 animation-duration:10.4s;animation-delay:-5.2s;
}
.review-group:nth-child(3n) .category-symbol,
.review-bar-select:nth-child(3n) .category-symbol,
.legend-row:nth-child(3n) .category-symbol,
.inline-line:nth-child(3n) .category-symbol{
 animation-duration:11.3s;animation-delay:-7.1s;
}
.review-group-toggle:hover .category-symbol,
.review-bar-select:hover .category-symbol,
.inline-line:hover .category-symbol{
 animation:paaxixi-symbol-hover .48s ease-out 1 both;
}
@keyframes paaxixi-symbol-hop{
 0%,66%,84%,100%{transform:translateY(0) rotate(0deg) scale(1)}
 70%{transform:translateY(-3px) rotate(-9deg) scale(1.10)}
 74%{transform:translateY(0) rotate(6deg) scale(.98)}
 78%{transform:translateY(-1px) rotate(-3deg) scale(1.04)}
}
@keyframes paaxixi-symbol-hover{
 0%{transform:translateY(0) rotate(0) scale(1)}
 50%{transform:translateY(-3px) rotate(-8deg) scale(1.14)}
 100%{transform:translateY(0) rotate(0) scale(1)}
}
/* Cashflow totals pulse in place, with a gentle border glow for KPI cards. */
.cashflow-card{
 position:relative;
 isolation:isolate;
 overflow:hidden;
 border-color:var(--line);
 animation:paaxixi-card-gleam 10s ease-in-out infinite;
}
.cashflow-card-income{--cashflow-aura:rgba(31,157,91,.17);--cashflow-outline:rgba(33,151,82,.34);animation-delay:-2s}
.cashflow-card-expense{--cashflow-aura:rgba(207,67,80,.15);--cashflow-outline:rgba(209,78,88,.34);animation-delay:-5.5s}
.cashflow-card .card-icon{transition:transform .25s ease}
.cashflow-card:hover .card-icon{transform:translateY(-2px) scale(1.08)}
.cashflow-number{
 display:inline-block;
 transform-origin:left center;
 animation:paaxixi-cashflow-pulse 9.4s ease-in-out infinite;
}
.cashflow-number-income{--cashflow-glow:rgba(22,152,76,.28);animation-delay:-1.7s}
.cashflow-number-expense{--cashflow-glow:rgba(205,58,72,.28);animation-delay:-5s}
.cashflow-card .cashflow-number{font-weight:900}
.cashflow-summary{position:relative;border-radius:12px}
.cashflow-summary-income{background:#f1fbf5!important}
.cashflow-summary-expense{background:#fff4f5!important}
.tx-cal-legend .cashflow-number{font-weight:900;letter-spacing:-.15px}
@keyframes paaxixi-cashflow-pulse{
 0%,66%,82%,100%{transform:scale(1);filter:drop-shadow(0 0 0 transparent)}
 72%{transform:scale(1.028);filter:drop-shadow(0 0 7px var(--cashflow-glow,transparent))}
 77%{transform:scale(1.008);filter:drop-shadow(0 0 2px var(--cashflow-glow,transparent))}
}
@keyframes paaxixi-card-gleam{
 0%,65%,83%,100%{box-shadow:var(--shadow);border-color:var(--line)}
 73%{box-shadow:0 0 0 3px var(--cashflow-aura,transparent),0 10px 27px var(--cashflow-aura,transparent);border-color:var(--cashflow-outline,var(--line))}
}
@media(prefers-reduced-motion:reduce){
 .category-symbol,.cashflow-number,.cashflow-card{
  animation:none!important;
  transform:none!important;
  filter:none!important;
 }
 .cashflow-card .card-icon{transition:none!important}

 0%{opacity:0;transform:translate(62px,-80px) rotate(14deg) scale(.75)}
 55%{opacity:1;transform:translate(-4px,11px) rotate(-7deg) scale(1.07)}
 73%{transform:translate(3px,-10px) rotate(4deg) scale(.98)}
 86%{transform:translate(-1px,4px) rotate(-2deg) scale(1.015)}
 100%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}

 27%{transform:translateY(-2px) scale(1.005) rotate(-.3deg)}
 47%{transform:translateY(-5px) scale(1.012) rotate(.35deg)}

.point-pie-panel{

.point-pie-layout{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px;align-items:center}

.point-pie-slice:is(:hover,:focus-visible,.selected){stroke-width:30;filter:brightness(1.08)}
.point-pie-slice.muted{opacity:.25}
.point-pie-slice:focus-visible{stroke-width:31}
.point-pie-center{position:absolute;inset:27%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;pointer-events:none}
.point-pie-center span{font:850 10px Nunito,sans-serif;color:#7b9e8e}
.point-pie-center strong{font:900 12px/1.2 Nunito,sans-serif;color:var(--point-accent);white-space:nowrap}
.point-pie-center small{font:850 10px Nunito,sans-serif;color:#7b9e8e}
.point-pie-items{min-width:0;display:grid;gap:5px;max-height:184px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:2px}
.point-pie-items-header{display:flex;justify-content:space-between;gap:10px;color:var(--point-accent);font:900 11px Nunito,sans-serif}
.point-pie-items-header span{font:750 10px Nunito,sans-serif;opacity:.8}
.point-pie-item{

 padding:6px 8px;text-align:left;cursor:pointer;

}
.point-pie-item:is(:hover,.selected){background:var(--point-soft);border-color:var(--point-border)}
.point-pie-item:hover{transform:translateX(2px)}
.point-pie-item.selected{border-color:var(--point-accent)}
.point-pie-color{display:inline-block;flex:none;width:9px;height:9px;border-radius:50%;background:var(--point-pie-color)}
.point-pie-name{min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font:900 11px Nunito,sans-serif;color:#315969}
.point-pie-percent{color:var(--point-accent);font:900 10px Nunito,sans-serif}
.point-pie-item strong{font:900 10px Nunito,sans-serif;color:#33556b;white-space:nowrap}
.point-pie-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 0}
.point-pie-actions button,.point-active-filter button{

 color:var(--point-accent,#288665);font:900 10px Nunito,sans-serif;cursor:pointer;
}

.point-pie-actions span{font:750 10px Nunito,sans-serif;color:#7b8f99}
.point-pie-empty{padding:11px;text-align:center;color:#8196a1}
.point-transaction-section{margin-top:13px}
.point-transaction-section>h4{font:900 16px Fredoka,Nunito,sans-serif;color:#1b517c;margin:0 0 11px}
.point-active-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#eff9f4;color:#548269;padding:8px 10px;margin-bottom:11px;border-radius:10px;font:850 11px Nunito,sans-serif}

.point-detail-popup .review-modal-content .review-block{margin:10px 0}
.point-detail-popup .review-modal-content .review-item{padding:12px}
.point-detail-popup .point-pie-item:focus-visible,.point-detail-popup .point-pie-slice:focus-visible{outline:3px solid #82cdaa;outline-offset:2px}
@keyframes pointPieEnter{from{opacity:.35;transform:translateY(8px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:560px){

 .point-pie-donut{width:124px;height:124px}

/* #113 Anggaran per kelompok: palet hidup, accordion, dan pos turunan warna kelompok. */
.budget-groups-manager{margin-bottom:16px;border-color:#d8e5f7}
.budget-groups-manager .card-head{align-items:center}
.budget-manager-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,265px),1fr));gap:12px}
.budget-manager-card{
 --budget-theme:#2563eb;--budget-theme-light:#eaf2ff;
 position:relative;isolation:isolate;min-width:0;overflow:visible;
 border-radius:19px;border:1.5px solid color-mix(in srgb,var(--budget-theme) 30%,white);
 background:linear-gradient(140deg,
  color-mix(in srgb,var(--budget-theme) 15%,white),
  color-mix(in srgb,var(--budget-theme) 7%,white) 70%,#fff);
 box-shadow:0 7px 18px color-mix(in srgb,var(--budget-theme) 12%,transparent);
 padding:14px;
 transition:transform .22s ease,box-shadow .22s ease;
}
.budget-manager-card:hover{transform:translateY(-3px);box-shadow:0 12px 23px color-mix(in srgb,var(--budget-theme) 20%,transparent)}
.budget-manager-card::before,.budget-group-accordion::before{
 content:"";position:absolute;inset:0 0 auto;height:4px;border-radius:19px 19px 0 0;
 background:linear-gradient(90deg,var(--budget-theme),color-mix(in srgb,var(--budget-theme) 40%,white),transparent);
 pointer-events:none;
}
.budget-manager-glow{
 position:absolute;inset:0;border-radius:inherit;pointer-events:none;overflow:hidden;
}
.budget-manager-glow::after,.budget-group-accordion::after{
 content:"";position:absolute;inset:-30%;pointer-events:none;opacity:0;
 background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.48) 48%,transparent 64%);
 transform:translateX(-80%);
 animation:budgetGroupShimmer 7.2s ease-in-out infinite;

.budget-manager-card:nth-child(3n+2) .budget-manager-glow::after,
.budget-group-accordion:nth-child(3n+2)::after{animation-delay:-2.4s}

.budget-group-accordion:nth-child(3n)::after{animation-delay:-4.8s}
.budget-manager-head{display:flex;align-items:center;gap:9px;min-width:0;position:relative;z-index:1}
.budget-manager-icon,.budget-summary-icon{display:grid;place-items:center;flex:none;
 border-radius:13px;padding:5px;background:color-mix(in srgb,var(--budget-theme) 14%,white);
 box-shadow:0 4px 12px color-mix(in srgb,var(--budget-theme) 13%,transparent)}

.budget-manager-stats small{font:750 10px Nunito,sans-serif;color:#6f83a0}
.budget-manager-stats b{font:900 clamp(10px,1.05vw,12px)/1.3 Nunito,sans-serif;

 border-radius:12px;background:#fff;box-shadow:0 12px 28px #153d6552;animation:budgetMenuEnter .18s ease-out both}

.budget-action-menu-list button.danger{color:#c44d5b}

.budget-accordion-list{display:grid;gap:15px;min-width:0}
.budget-group-accordion{
 --budget-theme:#2563eb;--budget-theme-light:#eaf2ff;
 position:relative;isolation:isolate;min-width:0;overflow:visible;
 border:1.5px solid color-mix(in srgb,var(--budget-theme) 30%,white);border-radius:20px;

.budget-summary-totals small{font:750 10px Nunito,sans-serif;color:#7086a3}

/* #124 Penjajaran panah dropdown lintas seluruh menu.
   Karakter font panah lama disembunyikan; chevron digambar simetris,
   sehingga tidak bergeser karena baseline/font Windows, Android, atau iOS. */
#content :is(
 .budget-detail-chevron,.budget-detail-open-hint>span,
 .review-group-chevron,.budget-bygroup-arrow,.budget-bygroup-hint>span,
 .kpi-account-balance>span,.debt-quick-expand>span,
 .review-export-caret,.tx-search-date-chevron,.comp-chevron,.income-month-chevron
){
 display:inline-grid!important;place-items:center!important;align-content:center!important;
 justify-content:center!important;flex-shrink:0;box-sizing:border-box;
 font-size:0!important;line-height:0!important;text-align:center;
 vertical-align:middle;margin-block:0!important;
 transform:none!important;
}
#content :is(
 .budget-detail-chevron,.budget-detail-open-hint>span,
 .review-group-chevron,.budget-bygroup-arrow,.budget-bygroup-hint>span,
 .kpi-account-balance>span,.debt-quick-expand>span,
 .review-export-caret,.tx-search-date-chevron,.comp-chevron,.income-month-chevron
)::before{
 content:"";display:block;box-sizing:border-box;pointer-events:none;
 width:10px;height:10px;border-right:2.25px solid currentColor;
 border-bottom:2.25px solid currentColor;border-radius:0 1px 1px 1px;
 transform:translateY(-2px) rotate(45deg);
 transform-origin:50% 50%;
 transition:transform .2s ease;
}

#content .budget-bygroup-hint>span,
#content .debt-quick-expand>span,
#content .kpi-account-balance>span{
 width:18px;height:18px;min-width:18px;padding:0;margin-inline:2px;

#content .comp-chevron,
#content .tx-search-date-chevron{
 width:19px;height:19px;min-width:19px;padding:0;margin-inline:0;
}

}

#content .budget-detail-group[open] .budget-detail-open-hint>span::before,
#content .review-group.is-open .review-group-chevron::before,
#content .budget-bygroup[open] .budget-bygroup-arrow::before,
#content .budget-bygroup[open] .budget-bygroup-hint>span::before,

#content .comp-picker.is-open .comp-chevron::before{
 transform:translateY(2px) rotate(225deg);
}

}
#content .tx-search-date-group[open] .tx-search-date-chevron::before{

const GROUP_COLOR_RECOMMENDATIONS=5;
const cleanGroupColor=color=>/^#[0-9a-fA-F]{6}$/.test(String(color||''))?String(color).toLowerCase():null;
function groupColorDistance(first,second){
 const a=[1,3,5].map(p=>parseInt(first.slice(p,p+2),16));
 const b=[1,3,5].map(p=>parseInt(second.slice(p,p+2),16));
 return Math.sqrt(a.reduce((sum,n,i)=>sum+Math.pow(n-b[i],2),0));
}
function uniqueExtraGroupColor(index){
 // Nuansa biru/teal, ungu, hijau, dan koral dengan distribusi golden angle.
 const hue=(199+index*137.50776405)%360;
 const saturation=57+(index%4)*4,lightness=43+(Math.floor(index/4)%4)*5;
 const c=(1-Math.abs(2*lightness/100-1))*saturation/100;
 const x=c*(1-Math.abs(hue/60%2-1)),m=lightness/100-c/2;
 const [r,g,b]=hue<60?[c,x,0]:hue<120?[x,c,0]:hue<180?[0,c,x]:hue<240?[0,x,c]:hue<300?[x,0,c]:[c,0,x];
 return '#'+[r,g,b].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('');
}
function freeGroupColorChoices(occupiedColors=[],count=GROUP_COLOR_RECOMMENDATIONS){
 const used=new Set(occupiedColors.map(cleanGroupColor).filter(Boolean));
 const chosen=[],all=[...GROUP_PALETTE];
 let index=0;
 // Saat semua warna kurasi dipakai, buat nuansa tambahan tetapi tetap unik.
 while(all.filter(item=>!used.has(item.value)).length<count+chosen.length&&index<500){
  const value=uniqueExtraGroupColor(index++);
  if(!used.has(value)&&!all.some(item=>item.value===value))all.push({value,name:'Nuansa '+(GROUP_PALETTE.length+index)});
 }
 const excluded=new Set(used);
 while(chosen.length<count){
  const candidates=all.filter(item=>!excluded.has(item.value));
  if(!candidates.length)break;
  const anchor=[...excluded];
  const ranked=candidates.map((item,idx)=>({
   item,idx,
   score:anchor.length?Math.min(...anchor.map(value=>groupColorDistance(item.value,value))):999
  }));
  ranked.sort((x,y)=>y.score-x.score||x.idx-y.idx);
  const best=ranked[0].item;
  chosen.push(best);excluded.add(best.value);
 }
 return chosen;
}

function normalizeExpenseGroups(value){
 const input=Array.isArray(value?.expenseGroups)&&value.expenseGroups.length?value.expenseGroups:DEFAULT_GROUPS;
 const result=[],names=new Set(),ids=new Set();
 for(const [i,g] of input.entries()){
  const name=String(g?.name||'').trim().slice(0,45),low=name.toLocaleLowerCase('id-ID');
  if(!name||names.has(low))continue;
  let id=String(g?.id||'').trim()||('group-legacy-'+i);
  if(ids.has(id))id='group-duplicate-'+i;
  result.push({id,name,color:cleanGroupColor(g?.color)});
  ids.add(id);names.add(low);
 }
 for(const c of value?.categories||[]){
  if(c.kind!=='expense'||!c.group)continue;
  const name=String(c.group).trim().slice(0,45),low=name.toLocaleLowerCase('id-ID');
  if(name&&!names.has(low)){
   result.push({id:'group-legacy-'+result.length,name,color:null});
   names.add(low);
  }
 }
 // Pertahankan warna valid yang sudah unik; pulihkan duplikasi/warna kosong
 // tanpa merebut warna milik kelompok lain.
 const seen=new Set();
 for(const item of result){
  if(item.color&&!seen.has(item.color))seen.add(item.color);
  else item.color=null;
 }
 for(const item of result){
  if(item.color)continue;
  item.color=freeGroupColorChoices([...seen],1)[0]?.value||'#2563eb';
  seen.add(item.color);
 }
 return {...value,expenseGroups:result.length?result:DEFAULT_GROUPS.map(g=>({...g})),
 budgetAdjustments:Array.isArray(value?.budgetAdjustments)?value.budgetAdjustments.filter(a=>a&&typeof a.id==='string'&&typeof a.month==='string'&&typeof a.categoryId==='string'&&['increase','decrease'].includes(a.type)&&Number.isFinite(Number(a.amount))&&Number(a.amount)>0):[],
 budgetBaseHistory:Array.isArray(value?.budgetBaseHistory)?value.budgetBaseHistory.filter(a=>a&&typeof a.categoryId==='string'&&typeof a.month==='string'):[],
 budgetInitialStates:(()=>{
  const states={};
  for(const [month,state] of Object.entries(value?.budgetInitialStates||{})){
   if(/^\d{4}-(0[1-9]|1[0-2])$/.test(month)&&['draft','locked'].includes(state?.status))
    states[month]={status:state.status,lockedAt:String(state.lockedAt||''),legacy:!!state.legacy};
  }
  // Data lama yang sudah memiliki alokasi atau transaksi dianggap sudah ditetapkan.
  const months=new Set([...Object.keys(value?.budgets||{}).map(k=>k.slice(0,7)),
   ...(value?.budgetMoves||[]).map(m=>m.month),...(value?.budgetAdjustments||[]).map(a=>a.month)]);
  for(const month of months)if(/^\d{4}-(0[1-9]|1[0-2])$/.test(month)&&!states[month])
   states[month]={status:'locked',lockedAt:'',legacy:true};
  return states;
 })()};
}

// Pasaran bersiklus 5 hari: Legi, Pahing, Pon, Wage, Kliwon.
function tanggalWetonWIB(date=new Date()){
 const parts=Object.fromEntries(new Intl.DateTimeFormat('id-ID',{
  timeZone:'Asia/Jakarta',weekday:'long',day:'numeric',month:'long',year:'numeric'
 }).formatToParts(date).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
 const year=Number(parts.year),month=Number(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Jakarta',month:'numeric'}).format(date)),day=Number(parts.day);
 const days=Math.round((Date.UTC(year,month-1,day)-Date.UTC(2026,9,19))/86400000);
 const pasaran=['Legi','Pahing','Pon','Wage','Kliwon'];
 const index=((3+days)%5+5)%5;
 return parts.weekday+' '+pasaran[index]+', '+day+' '+parts.month+' '+year;
}

/* #126 Aksi navigasi popup selalu terlihat di kanan atas header.
   Tombol dipindahkan, bukan disalin: event delegasi dan aksi semula tetap berlaku. */
function paxPromotePopupHeaderActions(root=document){
 if(!root)return;
 const modals=root.querySelectorAll('.review-modal-backdrop,.tx-history-backdrop,.budget-alert-dialog');
 modals.forEach(modal=>{
  const header=modal.classList.contains('budget-alert-dialog')
   ?modal.querySelector('.budget-alert-dialog-header')
   :modal.querySelector('.review-modal-top,.tx-entry-heading');
  if(!header||header.querySelector('.pax-popup-header-controls'))return;
  const buttons=[...modal.querySelectorAll(
   '.kpi-modal-actions button[data-nav],'+
   '.tx-history-footer button[data-nav],.tx-history-footer button[data-tx-create],'+
   '.budget-alert-dialog-footer button[data-nav],'+
   '.debt-quick-action button[data-debt-add],'+
   '.point-pie-actions button[data-point-pie-choice=""]'
  )].filter(button=>!button.matches('.point-pie-actions button.selected'));
  if(!buttons.length)return;
  const close=header.querySelector(
   ':scope > [data-review-close],:scope > [data-close-tx-history],'+
   ':scope > [data-budget-alert-close]'
  );
  if(!close)return;
  const controls=document.createElement('div');
  controls.className='pax-popup-header-controls';
  controls.setAttribute('role','group');
  controls.setAttribute('aria-label','Aksi cepat popup');
  const actionGroup=document.createElement('div');
  actionGroup.className='pax-popup-header-actions';
  const sources=new Set();
  buttons.forEach(button=>{
   const source=button.parentElement;
   if(source)sources.add(source);
   button.classList.add('pax-popup-header-cta');
   actionGroup.appendChild(button);
  });
  controls.append(actionGroup,close);
  header.appendChild(controls);
  // Wrapper lama tidak lagi memakan tinggi/ruang gulir setelah tombol dipindahkan.
  sources.forEach(source=>{
   if(source.matches('.kpi-modal-actions,.tx-history-footer,.debt-quick-action')&&!source.children.length)source.remove();
  });
 });
}

/* #081 Sejajarkan titik awal donut dan tren walau tinggi filternya berbeda. */
let analysisChartResizeObserver=null,analysisChartAlignmentQueued=false;
function alignAnalysisCharts(){
 const area=document.querySelector('.analytics-comp-trend');
 const donutAnchor=area?.querySelector('[data-analysis-graph="donut"]');
 const trendAnchor=area?.querySelector('[data-analysis-graph="trend"]');
 if(!donutAnchor||!trendAnchor)return;
 // Hapus offset lama agar tidak menumpuk saat filter, mode, atau ukuran layar berubah.
 donutAnchor.style.marginTop='0px';
 trendAnchor.style.marginTop='0px';
 const donutCard=area.querySelector('#composition-card');
 const trendCard=area.querySelector('#trend-analysis');
 if(!donutCard||!trendCard)return;
 const leftRect=donutCard.getBoundingClientRect();
 const rightRect=trendCard.getBoundingClientRect();
 // Pada tata letak bertumpuk (HP/tablet), masing-masing kartu tetap rapat tanpa ruang palsu.
 if(Math.abs(leftRect.top-rightRect.top)>4||Math.abs(leftRect.left-rightRect.left)<5)return;
 const donutPlot=donutAnchor.querySelector('.comp-recap-stage,.comp-distribution,.distribution,.comp-empty')||donutAnchor;
 const trendPlot=trendAnchor.querySelector('.trend-scroll,.comp-empty')||trendAnchor;
 const donutTop=donutPlot.getBoundingClientRect().top;
 const trendTop=trendPlot.getBoundingClientRect().top;
 const difference=donutTop-trendTop;
 if(difference>1)trendAnchor.style.marginTop=Math.ceil(difference)+'px';
 else if(difference< -1)donutAnchor.style.marginTop=Math.ceil(-difference)+'px';
}
function scheduleAnalysisChartAlignment(){
 if(analysisChartAlignmentQueued)return;
 analysisChartAlignmentQueued=true;
 requestAnimationFrame(()=>{analysisChartAlignmentQueued=false;alignAnalysisCharts();});
}
function observeAnalysisChartAlignment(){
 if(analysisChartResizeObserver)analysisChartResizeObserver.disconnect();
 const area=document.querySelector('.analytics-comp-trend');
 if(!area)return;
 if(typeof ResizeObserver!=='undefined'){
  analysisChartResizeObserver=new ResizeObserver(scheduleAnalysisChartAlignment);
  for(const selector of [
   '#composition-card .comp-header','#composition-card .comp-direct-period',
   '#composition-card .comp-direct-groups','#composition-card [data-analysis-graph="donut"]',
   '#trend-analysis .card-head','#trend-analysis .trend-quick-tools',
   '#trend-analysis .trend-series-picker','#trend-analysis .trend-label-toggle',
   '#trend-analysis [data-analysis-graph="trend"]'
  ]){const node=area.querySelector(selector);if(node)analysisChartResizeObserver.observe(node);}
 }
 scheduleAnalysisChartAlignment();
}
window.addEventListener('resize',scheduleAnalysisChartAlignment);
document.fonts?.ready?.then(scheduleAnalysisChartAlignment);


/* #087 Text width is measured using a DOM Range, so figures are NEVER split
   (including values with dots, negative amounts, and very long balances). */
let paaxKpiFitObserver=null,paaxKpiFitScheduled=false;
function paaxFitKpiSingleLine(el){
 if(!el||!el.isConnected)return;
 el.style.removeProperty('font-size');
 const max=parseFloat(getComputedStyle(el).fontSize);
 const room=el.clientWidth;
 if(!Number.isFinite(max)||!room)return;
 const range=document.createRange();
 range.selectNodeContents(el);
 // Allow some clearance for the gentle cashflow/focus scale animations.
 const available=Math.max(5,room-(el.classList.contains('metric')?Math.max(3,room*.045):2));
 const fits=size=>{
  el.style.fontSize=size.toFixed(2)+'px';
  return range.getBoundingClientRect().width<=available+.35;
 };
 if(fits(max))return;
 let low=6,high=max;
 // Binary search yields the largest font that keeps the COMPLETE text visible.
 for(let i=0;i<14;i++){
  const mid=(low+high)/2;
  if(fits(mid))low=mid;
  else high=mid;
 }
 el.style.fontSize=Math.max(6,low-.15).toFixed(2)+'px';
}
function paaxFitDashboardKpis(){
 if(ui.view!=='dashboard')return;
 document.querySelectorAll('#content .kpis:not(.budget-kpis) .kpi-detail-trigger').forEach(card=>{
  paaxFitKpiSingleLine(card.querySelector('.kpi-heading-title'));
  paaxFitKpiSingleLine(card.querySelector(':scope > .metric'));
 });
}
function paaxScheduleKpiFit(){
 if(paaxKpiFitScheduled)return;
 paaxKpiFitScheduled=true;
 requestAnimationFrame(()=>{
  paaxKpiFitScheduled=false;
  paaxFitDashboardKpis();
 });
}
function paaxObserveKpiWidths(){
 if(paaxKpiFitObserver){paaxKpiFitObserver.disconnect();paaxKpiFitObserver=null;}
 if(ui.view!=='dashboard')return;
 if(typeof ResizeObserver==='function'){
  paaxKpiFitObserver=new ResizeObserver(paaxScheduleKpiFit);
  document.querySelectorAll('#content .kpis:not(.budget-kpis) .kpi-detail-trigger').forEach(card=>
   paaxKpiFitObserver.observe(card));
 }
 paaxScheduleKpiFit();
}
window.addEventListener('resize',paaxScheduleKpiFit);
if(document.fonts){
 document.fonts.ready.then(paaxScheduleKpiFit);
 document.fonts.addEventListener?.('loadingdone',paaxScheduleKpiFit);
}

/* Hanya popup teratas yang bisa menerima fokus/klik saat beberapa popup tampil. */
function syncRenderedPopupLayers(){
 const roots=[...document.querySelectorAll(
  '#review-modal-backdrop,#tx-history-backdrop,#tx-search-backdrop,#tx-entry-backdrop,#debt-editor-backdrop,#repay-popup-backdrop'
 )];
 if(!roots.length)return;
 const ordered=roots.map(el=>({el,z:Number.parseInt(getComputedStyle(el).zIndex,10)||0}))
  .sort((a,b)=>a.z-b.z);
 const top=ordered[ordered.length-1]?.el;
 for(const {el} of ordered){
  const lower=el!==top;
  el.inert=lower;
  if(lower)el.setAttribute('aria-hidden','true');
  else el.removeAttribute('aria-hidden');
  const dlg=el.querySelector('[role="dialog"]');
  if(dlg)dlg.setAttribute('aria-modal',lower?'false':'true');
 }
}

const QUOTE_LAST_KEY='paaxixi-last-opening-quote-v1';
const QUOTE_CACHE_KEY='paaxixi-trend-quote-cache-v1';
let quoteMingguan=null,quoteSesi=null;
function quoteStrings(data){
 const values=[...(Array.isArray(data?.quotes)?data.quotes:[]),data?.quote];
 return [...new Set(values.filter(q=>typeof q==='string'&&q.trim()&&q.length<=190).map(q=>q.trim()))];
}
function bacaQuoteMingguanTersimpan(){
 try{
  const data=JSON.parse(localStorage.getItem(QUOTE_CACHE_KEY)||'null');
  if(data?.week===idMinggu()&&quoteStrings(data).length>0)return data;
 }catch(e){}
 return null;
}
function idMinggu(date=new Date()){
 const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
 d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));
 const y=d.getUTCFullYear();
 const w=Math.ceil((((d-new Date(Date.UTC(y,0,1)))/86400000)+1)/7);
 return y+'-W'+String(w).padStart(2,'0');
}
function kutipanMingguan(){
 if(quoteSesi)return quoteSesi;
 // Satu pilihan per pembukaan situs; navigasi, sinkronisasi, dan edit tidak mengacaknya.
 if(!quoteMingguan)quoteMingguan=bacaQuoteMingguanTersimpan();
 const pool=quoteMingguan?.week===idMinggu()?quoteStrings(quoteMingguan):QUOTES_GEN_Z;
 const pilihan=pool.length?pool:QUOTES_GEN_Z;
 let terakhir='';
 try{terakhir=localStorage.getItem(QUOTE_LAST_KEY)||'';}catch(e){}
 const belumTampil=pilihan.filter(q=>q!==terakhir);
 const calon=belumTampil.length?belumTampil:pilihan;
 const dipilih=calon[Math.floor(Math.random()*calon.length)];
 quoteSesi={quote:dipilih,week:idMinggu()};
 try{localStorage.setItem(QUOTE_LAST_KEY,dipilih);}catch(e){}
 return quoteSesi;
}
async function muatQuoteMingguan(){
 try{
  const minggu=idMinggu();
  const url='https://raw.githubusercontent.com/muhalfarisxi/Duit-Duit_Paaxixi/main/quote-mingguan.json?minggu='+encodeURIComponent(minggu);
  const res=await fetch(url,{cache:'no-store'});
  if(!res.ok)throw new Error('Quote mingguan belum tersedia');
  const data=await res.json();
  if(data?.week!==minggu||quoteStrings(data).length<1)return;
  quoteMingguan={week:minggu,quote:data.quote,quotes:quoteStrings(data),theme:typeof data.theme==='string'?data.theme.slice(0,40):'Gen Z & Budgeting',is_trending:data.is_trending===true};
  // Simpan pilihan tema mingguan untuk pembukaan berikutnya. Jangan ganti quote di tengah popup.
  try{localStorage.setItem(QUOTE_CACHE_KEY,JSON.stringify(quoteMingguan));}catch(e){}
 }catch(err){console.info('Quote cadangan dipakai:',err.message)}
}

/* Warna pos yang konsisten dengan induk kelompok:
   Living Fix = variasi biru, Playing = sian/biru, Living Lain = ungu/biru. */
const ANALYTICS_POS_PALETTES={
 'LIVING FIX':['#2563eb','#487fe1','#6978de','#3d9bd7','#789aee','#5275bf','#87a8e8','#4663c1'],
 'PLAYING':['#35a9ec','#5d7de5','#72bdf0','#528fd4','#8ba2e9','#3c91c9','#6f97dd','#7bcbea'],
 'LIVING LAIN':['#7c73df','#9980e6','#678ddc','#a79ce9','#6e80c9','#7cabde','#b3a2e8','#4d87c3']
};
function analysisPosColor(category){
 const withinGroup=expenses().filter(item=>item.group===category.group);
 const index=Math.max(0,withinGroup.findIndex(item=>item.id===category.id));
 const palette=ANALYTICS_POS_PALETTES[category.group];
 if(palette)return palette[index%palette.length];
 const group=expenseGroups().find(item=>item.name===category.group);
 return index===0&&/^#[0-9a-f]{6}$/i.test(group?.color||'')?group.color:ANALYTICS_COLORS[index%3];
}
const dateISO=(date)=>date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');
/* Analitik selalu berakhir pada hari ini menurut WIB, bukan akhir kalender bulan. */
function analysisToday(){
 const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
 const data=Object.fromEntries(parts.filter(p=>p.type!=='literal').map(p=>[p.type,p.value]));
 return data.year+'-'+data.month+'-'+data.day;
}
function monthBounds(month){
 const [year,m]=month.split('-').map(Number),cutoff=analysisToday();
 const from=month+'-01',to=dateISO(new Date(year,m,0));
 return {from:from>cutoff?cutoff:from,to:to>cutoff?cutoff:to};
}
function analysisDates(){
 const c=ui.comp,base=monthBounds(ui.month),cutoff=analysisToday();
 if(c.preset==='month')return {...base,title:monthFmt(ui.month)};
 if(c.preset==='range'){
  const from=c.from&&c.from<=cutoff?c.from:base.from;
  const to=c.to&&c.to<=cutoff?c.to:cutoff;
  // Nilai filter lama yang menunjuk masa depan otomatis dikembalikan ke hari ini.
  return from<=to?{from,to,title:'Rentang Tanggal'}:{...base,title:'Rentang Tanggal'};
 }
 const dates=db.transactions.filter(t=>t.type==='expense')
  .map(t=>t.date).filter(t=>/^\d{4}-\d{2}-\d{2}$/.test(t)&&t<=cutoff).sort();
 if(!dates.length)return {...base,title:'Semua Data'};
 return {from:dates[0],to:dates[dates.length-1],title:'Semua Data'};
}

function updateGroupScrollArrows(){
 document.querySelectorAll('[data-group-rail]').forEach(rail=>{
  const track=rail.querySelector('[data-group-scroll-track]');
  if(!track)return;
  const prev=rail.querySelector('.group-scroll-prev'),next=rail.querySelector('.group-scroll-next');
  if(!prev||!next)return;
  const canScroll=track.scrollWidth>track.clientWidth+2;
  prev.hidden=!canScroll;next.hidden=!canScroll;
  prev.disabled=!canScroll||track.scrollLeft<=2;
  next.disabled=!canScroll||track.scrollLeft+track.clientWidth>=track.scrollWidth-2;
 });
}
document.addEventListener('scroll',event=>{
 if(event.target?.matches?.('[data-group-scroll-track]'))updateGroupScrollArrows();
},true);
window.addEventListener('resize',updateGroupScrollArrows);

function trendAvailability(){
 const dates=analysisDates();
 return {dates,day:true,month:dates.from.slice(0,7)<dates.to.slice(0,7),year:dates.from.slice(0,4)<dates.to.slice(0,4)};
}
function trendRecommendedMode(){
 const a=trendAvailability();
 return a.year?'year':a.month?'month':'day';
}
function trendDefaultRange(mode=ui.comp.trend){
 const {from,to}=trendAvailability().dates;
 return mode==='year'?{from:from.slice(0,4),to:to.slice(0,4)}:mode==='month'?{from:from.slice(0,7),to:to.slice(0,7)}:{from,to};
}
function trendRange(){
 const dflt=trendDefaultRange(),a=ui.comp.trendFrom,b=ui.comp.trendTo;
 const from=a&&a>=dflt.from&&a<=dflt.to?a:dflt.from,to=b&&b>=dflt.from&&b<=dflt.to?b:dflt.to;
 return from>to?dflt:{from,to};
}
function resetTrendFromDonut(){
 ui.comp.trend=trendRecommendedMode();
 ui.comp.trendFrom='';ui.comp.trendTo='';
}
function trendPeriods(){
 const avail=trendAvailability(),mode=avail[ui.comp.trend]?ui.comp.trend:trendRecommendedMode();
 const range=trendRange(),limit=mode==='day'?60:mode==='month'?36:20;
 const keys=[];
 if(mode==='day'){
  let d=new Date(range.from+'T12:00:00'),end=new Date(range.to+'T12:00:00');
  while(d<=end&&keys.length<12000){keys.push(dateISO(d));d.setDate(d.getDate()+1);}
 }else if(mode==='month'){
  const serial=value=>{const [y,m]=value.split('-').map(Number);return y*12+m-1;};
  for(let n=serial(range.from);n<=serial(range.to)&&keys.length<2400;n++)keys.push(Math.floor(n/12)+'-'+String(n%12+1).padStart(2,'0'));
 }else{
  for(let y=Number(range.from);y<=Number(range.to)&&keys.length<300;y++)keys.push(String(y));
 }
 const trimmed=keys.length>limit;
 return {keys:trimmed?keys.slice(-limit):keys,trimmed,totalPeriods:keys.length,mode,range};
}
function trendLabel(key,mode){

 if(mode==='month')return new Date(key+'-01T12:00:00').toLocaleDateString('id-ID',{month:'short',year:'2-digit'});
 return key;
}

}

 return negative+money(n);

/* #037 Insight pengeluaran: arti data, tindakan konkret, dan pemeriksaan pencatatan. */
function trendPreviousMonth(month,offset){
 const a=/^(\d{4})-(\d{2})$/.exec(month);
 if(!a)return '';
 return new Date(Date.UTC(Number(a[1]),Number(a[2])-1+offset,1)).toISOString().slice(0,7);
}
function trendExpectedRoutine(){
 // Dua bulan berurutan belum membuktikan transaksi wajib terjadi; hanya sinyal untuk dicek.
 const now=today(),month=now.slice(0,7);
 if(ui.month!==month||!trendPeriods().keys.some(k=>ui.comp.trend==='day'?k===now:ui.comp.trend==='month'?k===month:k===month.slice(0,4)))return '';
 const lastMonth=trendPreviousMonth(month,-1),beforeLast=trendPreviousMonth(month,-2),currentDay=Number(now.slice(8,10));
 const candidates=[];
 for(const category of db.categories.filter(c=>c.kind==='income'||c.kind==='expense')){
  const prev1=db.transactions.filter(t=>t.type===category.kind&&t.categoryId===category.id&&t.date.startsWith(lastMonth));
  const prev2=db.transactions.filter(t=>t.type===category.kind&&t.categoryId===category.id&&t.date.startsWith(beforeLast));
  if(!prev1.length||!prev2.length||db.transactions.some(t=>t.type===category.kind&&t.categoryId===category.id&&t.date.startsWith(month)))continue;
  const title=String(category.label||''),recurringName=/gaji|tukin|deviden|dividen|uang makan|internet|wifi|wi-fi|tempat tinggal|kontrakan|sewa|kos|listrik|tagihan|cicilan|langganan|iuran|asuransi/i.test(title);
  // Pos tidak rutin tidak ditebak hanya karena kebetulan ada di dua bulan.
  // Pos umum perlu minimal tiga bulan konsisten agar tidak salah menganggap belanja sesekali sebagai kewajiban rutin.
  const threeMonthsAgo=trendPreviousMonth(month,-3);
  const prev3=db.transactions.filter(t=>t.type===category.kind&&t.categoryId===category.id&&t.date.startsWith(threeMonthsAgo));
  const matches=[prev1,prev2,prev3];
  const stableTitles=matches.every(list=>list.length===1)&&
   String(prev1[0].title||'').trim().length>3&&
   matches.every(list=>String(list[0].title||'').trim().toLowerCase()===String(prev1[0].title||'').trim().toLowerCase())&&
   Math.max(...matches.map(list=>Number(list[0].date.slice(8,10))))-Math.min(...matches.map(list=>Number(list[0].date.slice(8,10))))<=5&&
   Math.max(...matches.map(list=>num(list[0].amount)))-Math.min(...matches.map(list=>num(list[0].amount)))<=
    Math.max(10000,Math.max(...matches.map(list=>num(list[0].amount)))*.3);
  if(!recurringName&&!stableTitles)continue;
  const due=Math.max(...prev1.concat(prev2).map(t=>Number(t.date.slice(8,10))));
  const overdue=currentDay>Math.min(31,due+3);
  if(!overdue)continue;
  candidates.push({category,due});
 }
 candidates.sort((a,b)=>a.due-b.due||a.category.label.localeCompare(b.category.label,'id'));
 if(candidates.length){
  const c=candidates[0].category;
  return 'Perlu dicek: '+c.label+' tercatat pada dua bulan sebelumnya, tetapi belum ditemukan pada '+monthFmt(month)+'. Cek mutasi rekening atau bukti transaksi; bisa jadi memang belum terjadi.';
 }
 const thisMonth=db.transactions.filter(t=>(t.type==='expense'||t.type==='income')&&t.date.startsWith(month)&&t.date<=now);
 const lastDate=thisMonth.map(t=>t.date).sort().at(-1);
 if(thisMonth.length>=2&&lastDate){
  const lapse=Math.floor((Date.parse(now+'T12:00:00Z')-Date.parse(lastDate+'T12:00:00Z'))/86400000);
  if(lapse>=4)return 'Tidak ada pemasukan/pengeluaran tercatat sejak '+dateFmt(lastDate)+' ('+lapse+' hari). Periksa apakah memang tidak ada transaksi, atau ada yang belum dicatat.';
 }
 if(!thisMonth.length&&Number(now.slice(8,10))>=7)
  return 'Belum ada pemasukan atau pengeluaran tercatat bulan ini. Pastikan transaksi memang belum terjadi, atau lengkapi catatan jika ada.';
 return 'Belum ada sinyal kuat transaksi rutin yang tertinggal. Untuk memastikan kelengkapan, cocokkan catatan dengan mutasi rekening/e-wallet dan transaksi tunai; aplikasi tidak bisa mendeteksi transaksi yang belum diinput.';
}
function trendFinancialInsight(rows,entries,all,grandTotal,mode){
 const scope=ui.comp.breakdown==='group'?'kelompok':'pos';
 let meaning='',action='',check=trendExpectedRoutine();
 const groupsSelected=ui.comp.groups!==null||ui.comp.categories!==null;
 const scopeText=groupsSelected?' pada kelompok dan pos yang sedang difilter':'';
 const biggest=entries[0];
 if(!grandTotal){
  return {meaning:'Tidak ada pengeluaran tercatat dalam rentang tren dan pilihan filter ini. Angka kosong tidak otomatis berarti tidak ada pengeluaran sebenarnya.',
   action:'Cek periode dan filter yang dipilih. Jika memang ada transaksi, catat dari menu Transaksi Harian atau cek data yang tersinkron.',
   check};
 }
 if(biggest){
  const ratio=pct(biggest.value,grandTotal);
  meaning=(scope==='kelompok'?'Kelompok ':'Pos ')+biggest.label+' menyumbang '+ratio+'% ('+money(biggest.value)+') dari '+money(grandTotal)+' pengeluaran yang tercatat'+scopeText+'. ';
  meaning+=ratio>=50?'Pengeluaran terkonsentrasi di satu '+scope+'; ini belum cukup untuk menyimpulkan pemborosan.':'Komposisinya tidak didominasi satu '+scope+' secara ekstrem.';
 }
 // Bandingkan hanya dua periode SELESAI dan BERURUTAN, bukan bulan/tahun berjalan.
 const active=mode==='day'?today():mode==='month'?currentMonth():today().slice(0,4);
 const completed=rows.map((row,i)=>({...row,index:i})).filter(row=>row.key<active&&row.count>0);
 const end=completed.at(-1),before=completed.at(-2);
 const comparable=!!(end&&before&&end.index===before.index+1&&before.total>0);
 if(comparable){
  const diff=end.total-before.total;
  meaning+=' Pada '+trendLabel(end.key,mode)+' (periode selesai), pengeluaran '+(diff>0?'naik ':diff<0?'turun ':'tetap ')+

 }
 const rangeHasSelectedMonth=rows.some(row=>mode==='day'?row.key.startsWith(ui.month):mode==='month'?row.key===ui.month:row.key===ui.month.slice(0,4));
 const monthlySelected=analysisCategories();

  .filter(x=>x.used>x.limit).sort((a,b)=>(b.used-b.limit)-(a.used-a.limit)):[];
 const thin=rangeHasSelectedMonth?monthlySelected.filter(c=>hasBudget(c.id)).map(c=>({c,limit:effectiveBudget(c.id),used:spentByCat(c.id)}))
  .filter(x=>x.limit>0&&x.used<=x.limit&&x.used>=x.limit*.8).sort((a,b)=>(a.limit-a.used)-(b.limit-b.used)):[];
 if(overspend.length){

 }else{
  const monthIncome=monthly().filter(t=>t.type==='income').reduce((sum,t)=>sum+num(t.amount),0);
  const monthExpense=monthly().filter(t=>t.type==='expense').reduce((sum,t)=>sum+num(t.amount),0);
  if(rangeHasSelectedMonth&&monthIncome>0&&monthExpense>monthIncome)

  else if(comparable&&end.total>before.total*1.3&&end.total-before.total>=50000)

  else if(biggest)

 }
 return {meaning,action,check};
}

/* #084 Paaxixi Insight: analisis keuangan lokal berbasis pola statistik.
   Tidak memakai API/model eksternal, tidak mengunggah transaksi. */
function paaxMonthLast(month){
 const [year,index]=month.split('-').map(Number);
 return month+'-'+String(new Date(year,index,0).getDate()).padStart(2,'0');
}
function paaxInsightDays(first,last){
 const a=Date.parse(first+'T12:00:00Z'),b=Date.parse(last+'T12:00:00Z');
 return Number.isFinite(a)&&Number.isFinite(b)?Math.max(1,Math.round((b-a)/86400000)+1):1;
}
function paaxInsightMedian(values){
 if(!values.length)return 0;
 const sorted=values.slice().sort((a,b)=>a-b),middle=Math.floor(sorted.length/2);
 return sorted.length%2?sorted[middle]:(sorted[middle-1]+sorted[middle])/2;
}
function buildPaaxixiFinanceInsight(){

 const period=dates.from===dates.to?dateFmt(dates.from):dateFmt(dates.from)+' – '+dateFmt(dates.to);
 const findings=[],checks=[],actions=[];

 if(!tx.length){

 }
 const top=entries[0],share=top?top.value/total:0;
 const focus=top?top.icon+' '+top.label:'pengeluaran';
 const shareText=top?Math.round(share*100)+'% ('+money(top.value)+')':'';
 if(top){

  if(share>=.52){
   add(checks,'Konsentrasi biaya','Lebih dari separuh pengeluaran berasal dari '+top.label+'. Periksa rincian sebelum memangkas karena kebutuhan rutin bisa mendominasi.');
   add(actions,'Evaluasi prioritas','Tinjau transaksi '+top.label+' dan pisahkan yang wajib dari yang dapat ditunda sebelum menetapkan batas baru.');

 }
 // Hanya bulan kalender penuh yang dibandingkan. Bulan berjalan dan rentang parsial tidak layak dibanding langsung.
 const months=new Map();
 for(const t of tx){

 const completed=[...months.values()].filter(row=>

 ).sort((a,b)=>a.month.localeCompare(b.month));

 if(adjacent&&before.total>0){

  if(delta>0&&rate>=25&&delta>=100000){

 }else if(dates.from.slice(0,7)!==dates.to.slice(0,7)){

 if(dates.to===now&&dates.from<=now){

 // Pemeriksaan anggaran hanya jika seleksi mencakup seluruh bulan laporan aktif sampai akhir hari yang tersedia.

 const budgetItems=fullReportMonth?categories.filter(c=>hasBudget(c.id)&&effectiveBudget(c.id)>0)
  .map(c=>({c,limit:effectiveBudget(c.id),spent:spentByCat(c.id)})):[];
 const over=budgetItems.filter(item=>item.spent>item.limit).sort((a,b)=>(b.spent-b.limit)-(a.spent-a.limit));
 const near=budgetItems.filter(item=>item.spent<=item.limit&&item.spent>=item.limit*.85)

 if(over.length){

 // Perbandingan arus kas hanya saat semua kelompok ditampilkan dan periode tepat satu bulan.
 const sameMonth=dates.from.slice(0,7)===dates.to.slice(0,7);
 if(allGroups&&sameMonth&&dates.from.endsWith('-01')){
  const incomes=db.transactions.filter(t=>t.type==='income'&&t.date>=dates.from&&t.date<=dates.to)
   .reduce((sum,t)=>sum+num(t.amount),0);

   if(difference<0){

    add(actions,'Cocokkan arus uang','Pastikan seluruh pemasukan sudah tercatat, lalu tinjau pengeluaran yang bisa dijadwal ulang.');
    result.status='attention';
   }
  }else{
   add(checks,'Pemasukan belum terlihat','Belum ada pemasukan tercatat pada periode terpilih. Pastikan datanya lengkap sebelum menilai kemampuan belanja.');
  }
 }
 // Kandidat transaksi tidak biasa dibanding median pada pos yang sama, bukan seluruh transaksi.
 const catRows=new Map();
 for(const t of tx){const rows=catRows.get(t.categoryId)||[];rows.push(t);catRows.set(t.categoryId,rows);}
 const outliers=[];
 for(const [id,items] of catRows){
  if(items.length<5)continue;
  const median=paaxInsightMedian(items.map(t=>num(t.amount))),maxItem=items.slice().sort((a,b)=>num(b.amount)-num(a.amount))[0];
  if(median>0&&num(maxItem.amount)>=Math.max(120000,median*2.8)&&num(maxItem.amount)>=total*.04){
   outliers.push({item:maxItem,median,category:cat(id)?.label||'Pos lainnya',ratio:num(maxItem.amount)/median});
  }
 }
 outliers.sort((a,b)=>b.ratio-a.ratio);
 if(outliers.length){
  const item=outliers[0];
  add(checks,'Transaksi tak biasa','Ada '+money(item.item.amount)+' pada '+item.category+' ('+dateFmt(item.item.date)+
   '), sekitar '+item.ratio.toLocaleString('id-ID',{maximumFractionDigits:1})+' kali median nominal pos tersebut. Belum tentu salah.');
  add(actions,'Verifikasi nilai besar','Cek bukti pembayaran dan kategori '+item.category+'. Jika benar, tandai sebagai kebutuhan sesekali agar tidak dianggap pola rutin.');

 }
 const frequent=categories.flatMap(c=>{

  return [...byMonth.entries()].map(([month,list])=>({c,month,list,total:list.reduce((sum,t)=>sum+num(t.amount),0)}));
 }).filter(item=>item.list.length>=5).sort((a,b)=>b.list.length-a.list.length||b.total-a.total);
 if(frequent.length){

    ' hari terakhir. Ini bisa berarti memang tidak ada belanja, atau pencatatannya tertunda.');

 if(actions.length===0){

 }
 if(result.status==='neutral'&&checks.length>0)result.status='watch';
 const primary=over[0];
 result.headline=primary?'Perhatikan anggaran '+primary.c.label+' yang telah terlampaui.':
  allGroups&&sameMonth&&checks.some(v=>v.label==='Selisih arus kas negatif')?

  share>=.52?'Pengeluaran paling terkonsentrasi pada '+top.label+'.':
  adjacent?'Pola dua bulan penuh terakhir sudah bisa dibandingkan.':
  'Fokus pemeriksaan: '+(top?top.label:'pengeluaran terpilih')+'.';
 result.summary=tx.length+' transaksi pada '+activeDays+' hari tercatat selama '+period+

/* #086 Auto insight: precompute only on dashboard; debounce + session budget + cache.
   Auto requests transfer aggregate financial data to Firebase AI Logic, not raw transactions. */
function paaxAiCurrent(){
 if(ui.view!=='dashboard')return null;
 const payload=paaxAiSummaryPayload();
 return {payload,signature:JSON.stringify(payload)};
}
function paaxAiCachePut(signature,entry){
 paaxAiAuto.cache.delete(signature);
 paaxAiAuto.cache.set(signature,entry);
 while(paaxAiAuto.cache.size>14){
  paaxAiAuto.cache.delete(paaxAiAuto.cache.keys().next().value);
 }
}
function paaxAiCacheGet(signature){
 const entry=paaxAiAuto.cache.get(signature);
 if(entry?.error&&Date.now()>entry.retryAfter){
  paaxAiAuto.cache.delete(signature);return null;
 }
 return entry||null;
}
function paaxAiStopScheduled(){
 if(paaxAiAuto.timer!==null){clearTimeout(paaxAiAuto.timer);paaxAiAuto.timer=null;}
}
function paaxAiSchedule(urgent=false){
 paaxAiStopScheduled();
 if(ui.view!=='dashboard'||!window.ARUS_AI_APP_CHECK_SITE_KEY)return;
 const current=paaxAiCurrent();
 if(!current||current.payload.pengeluaran.jumlahTransaksi===0)return;
 if(paaxAiCacheGet(current.signature)||paaxAiAuto.inFlight)return;
 if(paaxAiAuto.autoCalls>=paaxAiAuto.maxAutoCalls)return;
 const elapsed=Date.now()-paaxAiAuto.lastStarted;
 const delay=Math.max(urgent?0:paaxAiAuto.debounceMs,paaxAiAuto.lastStarted?paaxAiAuto.cooldownMs-elapsed:0);
 paaxAiAuto.timer=setTimeout(()=>{
  paaxAiAuto.timer=null;
  const latest=paaxAiCurrent();
  if(!latest||latest.signature!==current.signature){paaxAiSchedule();return;}
  if(paaxAiAuto.inFlight)return; // Existing request will reschedule for the latest filter on completion.
  if(typeof window.PAAX_AI_GENERATE!=='function'){
   // The ES module can still be loading at page startup.
   paaxAiAuto.timer=setTimeout(()=>{paaxAiAuto.timer=null;paaxAiSchedule(true);},2500);
   return;
  }
  void paaxAiStart(latest,false);
 },Math.max(0,delay));
}
async function paaxAiStart(current,manual=false){
 if(!current)return;
 paaxAiStopScheduled();
 if(paaxAiAuto.inFlight){
  const active=paaxAiAuto.inFlight;
  if(active.signature===current.signature)return active.promise;
  // A manual refresh waits for the prior filter; automatic runs resume in finally.
  if(manual){
   await active.promise;
   const latest=paaxAiCurrent();
   if(latest?.signature===current.signature)return paaxAiStart(latest,true);
  }
  return;
 }
 if(!manual&&paaxAiCacheGet(current.signature))return;
 const fn=window.PAAX_AI_GENERATE;
 if(typeof fn!=='function'){
  if(manual){paaxAiCachePut(current.signature,{error:'Modul Gemini masih dimuat. Coba sebentar lagi.',retryAfter:Date.now()+5000});if(paaxAiUi.waitingFor===current.signature)paaxAiUi.waitingFor=null;if(paaxAiUi.open)render();else paaxAiRefreshStrip();}
  return;
 }
 if(manual)paaxAiAuto.cache.delete(current.signature);
 else paaxAiAuto.autoCalls++;
 paaxAiAuto.lastStarted=Date.now();
 const request={signature:current.signature,promise:null};
 paaxAiAuto.inFlight=request;
 if(paaxAiUi.open)render();else paaxAiRefreshStrip();
 request.promise=(async()=>{
  try{
   const report=await fn(current.payload);
   paaxAiCachePut(current.signature,{report,savedAt:Date.now()});
  }catch(err){
   // Do not auto-loop on 429, 5xx or App Check errors. Manual retry stays available.
   const message=String(err?.message||'Layanan Gemini tidak dapat dihubungi.').slice(0,210);
   const retryAfter=Date.now()+(/kuota|rate.limit|429/i.test(message)?5*60000:2*60000);
   paaxAiCachePut(current.signature,{error:message,retryAfter});
  }finally{
   if(paaxAiAuto.inFlight===request)paaxAiAuto.inFlight=null;
   if(ui.view==='dashboard'){
    const requested=paaxAiUi.waitingFor===request.signature;
    if(requested){
     paaxAiUi.waitingFor=null;
     const fresh=paaxAiCurrent();
     if(fresh?.signature===request.signature&&paaxAiCacheGet(request.signature)?.report){
      paaxAiUi.localFallback=false;
      paaxAiUi.open=true;
      render();
     }else paaxAiRefreshStrip();
    }else if(paaxAiUi.open)render();
    else paaxAiRefreshStrip();
    paaxAiSchedule();
   }else if(paaxAiUi.waitingFor===request.signature)paaxAiUi.waitingFor=null;
  }
 })();
 return request.promise;
}

   A selected filter is never fulfilled by an earlier filter's result. */
/* #089 Micro-insight: use the most actionable verified local finding, not AI load status. */
function paaxAiFinancialHint(local){
 if(!local||!local.count){
  return '📝 '+(local?.actions?.[0]?.text||'Catat pengeluaran agar pola keuangan dapat dievaluasi.');
 }
 const check=label=>local.checks?.find(item=>item.label===label);
 const action=label=>local.actions?.find(item=>item.label===label);
 const choose=(item,prefix='💡')=>item?.text?prefix+' '+item.text.trim():null;
 // Risks and available budget take priority over routine category commentary.
 const over=check('Anggaran terlampaui');
 if(over)return '⚠️ '+over.text.split(' (')[0].replace(/\.$/,'')+'. Periksa alokasinya.';
 for(const [label,prefix] of [
  ['Jaga sisa anggaran','⚠️'],
  ['Cocokkan arus uang','⚠️'],
  ['Verifikasi nilai besar','🔎'],
  ['Rekonsiliasi transaksi','🧾'],
  ['Atur batas fleksibel','🎯'],
  ['Evaluasi prioritas','🎯']
 ]){
  const msg=choose(action(label),prefix);
  if(msg)return msg;
 }
 const next=local.actions?.find(item=>item.text)?.text;
 return next?'💡 '+next.trim():'📌 Periksa transaksi terbesar dan kecocokannya dengan anggaran.';
}

function paaxAiStripState(current=paaxAiCurrent(),local=buildPaaxixiFinanceInsight()){
 const signature=current?.signature||'';
 if(paaxAiUi.waitingFor&&paaxAiUi.waitingFor!==signature)paaxAiUi.waitingFor=null;
 const saved=signature?paaxAiCacheGet(signature):null;
 const ready=!!saved?.report;
 const waiting=!!signature&&paaxAiUi.waitingFor===signature;
 const loading=!ready&&(waiting||paaxAiAuto.inFlight?.signature===signature);
 const available=!!String(window.ARUS_AI_APP_CHECK_SITE_KEY||'').trim();
 const hasExpense=!!current?.payload?.pengeluaran?.jumlahTransaksi;
 const localOnly=!available||!hasExpense;
 const failed=!!saved?.error&&!loading&&!ready;
 const status=paaxAiFinancialHint(local);
 const label=ready?'✨ Lihat Hasil AI':
  waiting?'Menunggu Hasil AI…':
  loading?'Menyiapkan AI…':
  failed?'↻ Coba Gemini Lagi':
  localOnly?'📊 Lihat Ringkasan':'✨ Buka Insight';
 return {ready,waiting,loading,localOnly,failed,status,label,
  localButton:failed&&!paaxAiUi.open};
}

async function paaxAiOpenWhenReady(){
 const current=paaxAiCurrent();
 if(!current)return;
 const state=paaxAiStripState(current);
 if(state.ready){
  paaxAiUi.waitingFor=null;
  paaxAiUi.localFallback=false;
  paaxAiUi.open=true;
  render();
  return;
 }
 if(state.localOnly){paaxAiOpenLocal();return;}
 if(paaxAiUi.waitingFor===current.signature)return;
 paaxAiUi.waitingFor=current.signature;
 paaxAiUi.localFallback=false;
 paaxAiRefreshStrip();
 // If background generation is in progress, reuse the same promise.
 // If another filter is in progress, wait for it before querying the current one.
 await paaxAiStart(current,true);
}

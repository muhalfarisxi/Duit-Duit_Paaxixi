function incomeFilterRange(){
 const filter=ui.incomeFilter||{preset:'month',from:'',to:''},now=analysisToday().slice(0,7),current=incomeChosenMonth();
 if(filter.preset==='month')return {from:current>now?now:current,to:current>now?now:current};
 const months=db.transactions.filter(t=>t.type==='income'&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&t.date<=analysisToday()).map(t=>t.date.slice(0,7)).sort();
 if(filter.preset==='all')return {from:months[0]||current,to:months[months.length-1]||current};
 const from=/^\d{4}-(?:0[1-9]|1[0-2])$/.test(filter.from||'')?filter.from:current;
 const to=/^\d{4}-(?:0[1-9]|1[0-2])$/.test(filter.to||'')?filter.to:current;
 return {from:from<=to?from:to,to:to>=from?to:from};
}
function incomeFilterLabel(){
 const r=incomeFilterRange();
 return r.from===r.to?monthFmt(r.from):monthFmt(r.from)+' – '+monthFmt(r.to);

function incomeGroupName(t){
 const category=cat(t.categoryId);
 return category?.kind==='income'&&category.group?category.group:'Lainnya';
}
function incomeFilterTransactions(period=null){
 const range=incomeFilterRange(),group=ui.incomeFilter?.group;
 return db.transactions.filter(t=>{
  if(t.type!=='income'||t.date>analysisToday()||(group&&incomeGroupName(t)!==group))return false;
  const month=t.date.slice(0,7);
  if(month<range.from||month>range.to)return false;
  return period?t.date.slice(0,period.length)===period:true;
 });
}
function incomeFilterGroups(){
 const groups=[...new Set([...incomes().map(c=>c.group||'Lainnya'),...db.transactions.filter(t=>t.type==='income').map(incomeGroupName)])];

function incomeEntryMatches(t,id){
 if(id.startsWith('group:'))return incomeGroupName(t)===id.slice(6);
 if(id==='_unknown')return cat(t.categoryId)?.kind!=='income';
 return t.categoryId===id;
}

function incomeSourceData(period=null){

 tx.forEach(t=>{
  const c=cat(t.categoryId),id=group?(c?.kind==='income'?t.categoryId:'_unknown'):'group:'+incomeGroupName(t);
  const label=group?(id==='_unknown'?'Sumber Lainnya':c.label):incomeGroupName(t);
  if(!map.has(id))map.set(id,{id,label,value:0,count:0});
  const row=map.get(id);row.value+=num(t.amount);row.count++;
 });
 return [...map.values()].filter(x=>x.value>0).sort((a,b)=>b.value-a.value).map((row,i)=>({...row,color:incomePalette[i%incomePalette.length]}));
}

function incomePieArc(start,end){
 const cx=120,cy=120,outer=96,inner=59;
 const xy=(r,a)=>`${(cx+r*Math.cos(a)).toFixed(3)} ${(cy+r*Math.sin(a)).toFixed(3)}`;
 const large=end-start>Math.PI?1:0;
 return `M ${xy(outer,start)} A ${outer} ${outer} 0 ${large} 1 ${xy(outer,end)} L ${xy(inner,end)} A ${inner} ${inner} 0 ${large} 0 ${xy(inner,start)} Z`;
}

function pointPieItems(transactions,kind,popup){
 const byPos=kind==='income'?!!ui.incomeFilter?.group:
  popup.scope==='group'||popup.scope==='category'||ui.comp.breakdown==='category';
 const grouped=new Map();
 for(const t of transactions){
  const c=cat(t.categoryId);
  const group=kind==='income'?incomeGroupName(t):(c?.group||'Lainnya');
  const id=byPos?'c:'+t.categoryId:'g:'+group;
  if(!grouped.has(id))grouped.set(id,{id,label:byPos?(c?.label||'Pos Lainnya'):group,value:0,count:0,category:c});
  const row=grouped.get(id);row.value+=num(t.amount);row.count++;
 }
 return [...grouped.values()].filter(item=>item.value>0).sort((a,b)=>b.value-a.value||a.label.localeCompare(b.label,'id')).map((item,i)=>({
  ...item,color:kind==='income'?incomePalette[i%incomePalette.length]:byPos?
   (item.category?analysisPosColor(item.category):'#8fa6c8'):
   (expenseGroups().find(g=>g.name===item.label)?.color||'#8fa6c8')
 }));
}
function pointPieMatches(t,key,kind){

 if(key.startsWith('c:'))return t.categoryId===key.slice(2);
 if(key.startsWith('g:'))return (kind==='income'?incomeGroupName(t):(cat(t.categoryId)?.group||'Lainnya'))===key.slice(2);
 return false;
}
function renderPointPie(transactions,kind,popup){

  const part=item.value/total*circumference,gap=Math.min(1.1,part*.03),draw=Math.max(.2,part-gap);
  const dash=draw.toFixed(3)+' '+(circumference-draw).toFixed(3);
  const html=`<circle cx="90" cy="90" r="${ring}" fill="none" stroke="${h(item.color)}" stroke-width="25"
   stroke-dasharray="${dash}" stroke-dashoffset="${(-offset).toFixed(3)}" transform="rotate(-90 90 90)"

   <title>${h(item.label)} · ${money(item.value)} (${pct(item.value,total)}%)</title></circle>`;
  offset+=part;return html;
 }).join('');
 const buttons=items.map(item=>`<button type="button" class="point-pie-item ${picked?.id===item.id?'selected':''}"

 return `<section class="point-pie-panel ${kind==='income'?'is-income':'is-expense'}"

}

let reviewPopupHistory=[];
function renderStackedReviewPopup(){
 if(!ui.reviewPopup)return '';
 const renderOne=()=>ui.view==='dashboard'?renderDashboardKpiPopup():renderReviewPopup();
 const current=ui.reviewPopup;let parents='';
 for(let index=0;index<reviewPopupHistory.length;index++){
  ui.reviewPopup=reviewPopupHistory[index].popup;
  const markup=renderOne();
  if(!markup)continue;
  parents+=markup
   .replace('id="review-modal-backdrop"','id="review-modal-parent-'+index+'" data-review-modal-parent aria-hidden="true" inert')
   .replace('aria-modal="true"','aria-modal="false"')
   .replaceAll('id="review-modal-title"','id="review-modal-parent-title-'+index+'"')
   .replaceAll('id="review-modal-subtitle"','id="review-modal-parent-subtitle-'+index+'"')
   .replaceAll('aria-labelledby="review-modal-title"','aria-labelledby="review-modal-parent-title-'+index+'"')
   .replaceAll('aria-describedby="review-modal-subtitle"','aria-describedby="review-modal-parent-subtitle-'+index+'"');
 }
 ui.reviewPopup=current;return parents+renderOne();
}

function kpiBalanceBreakdown(){
 const current=balances();
 const accounts=[...db.accounts.map(a=>({id:a.id,name:a.name,type:a.type,opening:num(a.opening)}))];
 for(const id of Object.keys(current))if(!accounts.some(a=>a.id===id))accounts.push({id,name:'Rekening Tidak Dikenal',type:'Referensi Lama',opening:0});
 const details=accounts.map(a=>{
  const tx=db.transactions.reduce((tot,t)=>{
   const amt=num(t.amount);
   if(t.type==='income'&&t.accountId===a.id)tot.inc+=amt;
   if(t.type==='expense'&&t.accountId===a.id)tot.exp+=amt;
   if(t.type==='transfer'&&t.accountId===a.id)tot.out+=amt;
   if(t.type==='transfer'&&t.toAccountId===a.id)tot.ins+=amt;
   return tot;
  },{inc:0,exp:0,ins:0,out:0});
  const debtEffect=db.debts.reduce((n,d)=>{
   const sign=d.type==='receivable'?-1:1;
   let v=n+(d.accountId===a.id?sign*num(d.amount):0);
   for(const settlement of d.settlements||[])if(settlement.accountId===a.id)v-=sign*num(settlement.amount);
   return v;
  },0);
  return {...a,...tx,debtEffect,balance:num(current[a.id])};
 }).sort((a,b)=>b.balance-a.balance||a.name.localeCompare(b.name,'id'));
 const total=Object.values(current).reduce((n,v)=>n+num(v),0);
 if(!details.length)return '<div class="review-modal-empty">Belum Ada Rekening Yang Dicatat.</div>';
 return `<div class="kpi-balance-intro"><span>Total Semua Rekening</span><strong class="${total<0?'red':'blue'}">${money(total)}</strong></div>
 <div class="kpi-detail-rows">${details.map(row=>`<details class="kpi-account-detail">
   <summary><span class="kpi-account-name"><span class="kpi-account-symbol">▤</span><span><strong>${h(row.name)}</strong><small>${h(row.type||'Rekening')}</small></span></span>

   <div class="kpi-account-breakdown">
    <div><span>Saldo Awal</span><strong>${money(row.opening)}</strong></div>
    <div><span>Pemasukan</span><strong class="green">+${money(row.inc)}</strong></div>
    <div><span>Pengeluaran</span><strong class="red">−${money(row.exp)}</strong></div>
    <div><span>Transfer Masuk</span><strong class="green">+${money(row.ins)}</strong></div>
    <div><span>Transfer Keluar</span><strong class="red">−${money(row.out)}</strong></div>
    <div><span>Pergerakan Utang/Piutang</span><strong class="${row.debtEffect<0?'red':'blue'}">${row.debtEffect>=0?'+':'−'}${money(Math.abs(row.debtEffect))}</strong></div>
    <div class="kpi-account-final"><span>Saldo Akhir</span><strong class="${row.balance<0?'red':'blue'}">${money(row.balance)}</strong></div>
   </div></details>`).join('')}</div>
  <p class="kpi-detail-note">Saldo seluruh waktu dihitung dari saldo awal, pemasukan, pengeluaran, transfer antar rekening, serta pencairan dan pelunasan utang/piutang. Ganti bulan tidak mengubah total ini.</p>
  <div class="kpi-modal-actions"><button type="button" class="btn sm" data-nav="accounts">Kelola Rekening →</button></div>`;
}

/* #053 Cari seluruh transaksi berdasarkan nama mirip atau nominal pengeluaran. */
function txSearchNormalize(input){
 return String(input||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('id-ID')
   .replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}
function txSearchEditDistance(a,b,limit){
 if(Math.abs(a.length-b.length)>limit)return limit+1;
 let previous=Array.from({length:b.length+1},(_,i)=>i);
 for(let i=1;i<=a.length;i++){
  let curr=[i],minimum=i;
  for(let j=1;j<=b.length;j++){
   curr[j]=Math.min(curr[j-1]+1,previous[j]+1,previous[j-1]+(a[i-1]===b[j-1]?0:1));
   minimum=Math.min(minimum,curr[j]);
  }
  if(minimum>limit)return limit+1;
  previous=curr;
 }
 return previous[b.length];
}
function txSearchIsAmount(value){
 const q=String(value||'').trim();
 return /^(?:rp\s*)?[\d.,\s]+$/i.test(q)&&/\d/.test(q);
}
function txSearchTitleScore(title,query){
 const q=txSearchNormalize(query),name=txSearchNormalize(title);
 if(q.length<2||!name)return -1;
 if(name===q)return 0;
 if(name.startsWith(q))return 1;
 if(name.includes(q))return 2;
 const terms=q.split(' '),words=name.split(' ');
 if(terms.every(term=>words.some(word=>word.startsWith(term))))return 3;
 if(terms.every(term=>words.some(word=>word.includes(term))))return 4;
 if(terms.every(term=>term.length>=3&&words.some(word=>{
  const limit=term.length<=5?1:2;
  return txSearchEditDistance(term,word,limit)<=limit;
 })))return 5;
 return -1;
}
/* Cari rekening sumber/penerima transfer dan transaksi rekening utama. */
function txSearchAccountScore(t,term){
 const accountNames=[acc(t.accountId)?.name];
 if(t.type==='transfer')accountNames.push(acc(t.toAccountId)?.name);
 const values=accountNames.map(name=>txSearchTitleScore(name,term)).filter(score=>score>=0);
 return values.length?Math.min(...values):-1;
}
function txSearchAccountMatch(t,ids){
 return ids.includes(t.accountId)||(t.type==='transfer'&&ids.includes(t.toAccountId));
}
function txSearchResults(query){
 const text=String(query||'').trim();
 const forcedAccount=/^rekening\s*:\s*/i.test(text);
 const term=forcedAccount?text.replace(/^rekening\s*:\s*/i,'').trim():text;
 const amountMode=!forcedAccount&&txSearchIsAmount(term);
 const digits=term.replace(/\D/g,'');
 const recent=(a,b)=>String(b.transaction.date||'').localeCompare(String(a.transaction.date||''))||
  String(b.transaction.createdAt||'').localeCompare(String(a.transaction.createdAt||''));
 if(amountMode&&digits.length){
  const results=db.transactions.filter(t=>t.type==='expense').map(t=>{
   const amount=String(Math.trunc(num(t.amount)));
   return {transaction:t,score:amount===digits?0:amount.startsWith(digits)?1:amount.includes(digits)?2:-1,matchedBy:'amount'};
  }).filter(item=>item.score>=0).sort((a,b)=>a.score-b.score||recent(a,b));
  const exact=results.filter(item=>item.score===0);
  return exact.length?exact:results;
 }
 if(txSearchNormalize(term).length<2)return [];
 if(forcedAccount){
  const exactAccounts=(db.accounts||[]).filter(a=>txSearchNormalize(a.name)===txSearchNormalize(term));
  if(exactAccounts.length){
   const ids=exactAccounts.map(a=>a.id);
   return db.transactions.filter(t=>txSearchAccountMatch(t,ids))
    .map(t=>({transaction:t,score:0,matchedBy:'account'})).sort(recent);
  }
  return db.transactions.map(t=>({transaction:t,score:txSearchAccountScore(t,term),matchedBy:'account'}))
   .filter(item=>item.score>=0).sort((a,b)=>a.score-b.score||recent(a,b));
 }
 return db.transactions.map(t=>{
  const title=txSearchTitleScore(t.title,term),account=txSearchAccountScore(t,term);
  if(account>=0&&(title<0||account<title))return {transaction:t,score:account,matchedBy:'account'};
  return {transaction:t,score:title,matchedBy:'name'};
 }).filter(item=>item.score>=0).sort((a,b)=>a.score-b.score||recent(a,b));
}
function txSearchHighlight(title,term){
 const value=String(title||'Transaksi');
 if(txSearchIsAmount(term))return h(value);
 const at=value.toLocaleLowerCase('id-ID').indexOf(String(term).toLocaleLowerCase('id-ID'));
 if(at<0||!term)return h(value);
 return h(value.slice(0,at))+'<mark class="tx-search-match">'+h(value.slice(at,at+term.length))+'</mark>'+h(value.slice(at+term.length));
}

function renderTxSearchItem(item,text,query,numeric,accountMode){
  const t=item.transaction,from=acc(t.accountId)?.name||'Rekening tidak tersedia';
  const to=t.type==='transfer'?acc(t.toAccountId)?.name||'Rekening tidak tersedia':'';
  const accountHtml=(!numeric)?txSearchHighlight(from,query):h(from);
  const destinationHtml=(!numeric)?txSearchHighlight(to,query):h(to);
  const detail=t.type==='transfer'?h('Transfer · ')+accountHtml+h(' → ')+destinationHtml:
   h((cat(t.categoryId)?.label||'Kategori tidak tersedia')+' · ')+accountHtml;
  const typeClass=t.type==='expense'?'red':t.type==='income'?'green':'blue';
  const sign=t.type==='expense'?'−':t.type==='income'?'+':'⇄ ';
  const label=accountMode?h(t.title||'Transaksi'):txSearchHighlight(t.title||'Transaksi',text);
  const similar=!numeric&&!accountMode&&item.matchedBy==='name'&&item.score===5?'<span class="tx-search-similar">Nama mirip</span>':'';
  const accountBadge=item.matchedBy==='account'?'<span class="tx-search-account-badge">Rekening cocok</span>':'';
  return '<article class="tx-history-item tx-search-result">'+
   '<div class="tx-history-item-head"><div><strong>'+label+similar+accountBadge+'</strong>'+
   '<small>'+h(dateFmt(t.date))+' · '+detail+'</small></div>'+
   '<b class="'+typeClass+'">'+sign+money(t.amount)+'</b></div>'+
   (t.note?'<p>'+h(t.note)+'</p>':'')+
   '<div class="tx-history-item-actions"><button type="button" class="btn sm" data-edit-tx="'+h(t.id)+'">✎ Edit</button>'+
   '<button type="button" class="btn sm danger" data-delete-tx="'+h(t.id)+'">Hapus</button></div></article>';
 
}
function renderTxSearchResults(){
 const text=String(ui.txSearchQuery||'').trim(),accountMode=/^rekening\s*:\s*/i.test(text);
 const query=accountMode?text.replace(/^rekening\s*:\s*/i,'').trim():text;
 const numeric=!accountMode&&txSearchIsAmount(text);
 if(!text||(!numeric&&txSearchNormalize(query).length<2)){
  return '<div class="tx-search-empty"><span aria-hidden="true">🔍</span><strong>Temukan transaksi dengan cepat</strong>'+
   '<p>Cari nama, nominal pengeluaran, atau nama rekening. Kamu juga bisa memilih rekening di atas.</p></div>';
 }
 const rows=txSearchResults(text);
 if(!rows.length)return '<div class="tx-search-empty"><span aria-hidden="true">🧐</span><strong>Tidak ada transaksi yang cocok</strong>'+
  '<p>'+(numeric?'Coba beberapa digit nominal yang lebih singkat.':accountMode?'Belum ada transaksi pada rekening ini. Coba rekening lainnya.':'Coba nama transaksi atau rekening yang lebih singkat.')+'</p></div>';
 const LIMIT=70,visible=rows.slice(0,LIMIT);
 const category=accountMode?'transaksi rekening':numeric?'pengeluaran':'transaksi';
 const mode=accountMode?'Rekening':numeric?'Nominal':'Nama atau rekening';
 const header='<p class="tx-search-count" role="status">'+rows.length+' '+category+' cocok'+
 (rows.length>LIMIT?' · '+LIMIT+' hasil teratas':'')+
 '<span> · Berdasarkan '+mode+' · Semua bulan</span></p>';
 const groups=new Map();
 visible.forEach(item=>{
  const date=item.transaction.date||'';
  if(!groups.has(date))groups.set(date,[]);
  groups.get(date).push(item);
 });
 return header+[...groups.keys()].sort((a,b)=>b.localeCompare(a)).map(date=>{
  const items=groups.get(date),totals=transactionDayTotals(items.map(x=>x.transaction));
  return '<details class="review-block tx-calendar-date-group tx-search-date-group" open>'+
   '<summary><span class="tx-search-date-label"><span class="tx-search-date-chevron" aria-hidden="true">▾</span>'+
    '<strong>'+h(date?dateFmt(date):'Tanggal tidak tersedia')+'</strong>'+
    '<span class="review-meta">· '+items.length+' Transaksi</span></span>'+
   '<span class="tx-cal-day-head-totals"><strong class="green">+'+money(totals.income)+'</strong>'+
    '<strong class="red">−'+money(totals.expense)+'</strong>'+
    (totals.transfer>0?'<strong class="blue">⇄ '+money(totals.transfer)+'</strong>':'')+
   '</span></summary><div class="tx-search-date-list">'+
    items.map(item=>renderTxSearchItem(item,text,query,numeric,accountMode)).join('')+
   '</div></details>';
 }).join('');
}

 },{income:0,expense:0,transfer:0});
}

// Acuan pasaran: 1 Oktober 2026 = Legi. Siklus berulang setiap lima hari.
function pasaranJawa(date){
 const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(date);
 if(!match)return '';
 const diff=Math.round((Date.UTC(Number(match[1]),Number(match[2])-1,Number(match[3]))-Date.UTC(2026,9,1))/86400000);
 const cycle=['Legi','Pahing','Pon','Wage','Kliwon'];
 return cycle[((diff%5)+5)%5];
}

function openFinanceEditor(kind,id=null,groupName=null){

/* #123 Rincian Anggaran: pemakaian per kelompok, lalu per pos di dropdown.
   Warna progress mengikuti perubahan efektif dari anggaran awal, terpisah dari status pemakaian. */
function budgetDetailTotals(categories){
 const initial=categories.reduce((sum,c)=>sum+baseBudget(c.id),0);
 const adjustment=categories.reduce((sum,c)=>sum+budgetAdjustmentNet(c.id),0);
 const transfer=categories.reduce((sum,c)=>sum+budgetTransferNet(c.id),0);
 const effective=categories.reduce((sum,c)=>sum+effectiveBudget(c.id),0);
 const used=categories.reduce((sum,c)=>sum+spentByCat(c.id),0);
 const relevantIds=new Set(categories.map(c=>c.id));
 let added=0,reduced=0;
 budgetAdjustmentsForMonth().forEach(a=>{if(!relevantIds.has(a.categoryId))return;if(a.type==='increase')added+=num(a.amount);else if(a.type==='decrease')reduced+=num(a.amount)});
 return {initial,adjustment,added,reduced,transfer,effective,used,remaining:effective-used,change:effective-initial};
}
function budgetDetailChangeTone(total){
 return total.change>0?'increase':total.change<0?'decrease':'steady';
}
function budgetDetailUsageStatus(total){
 if(total.remaining<0)return {tone:'danger',icon:'🚨',label:'Melewati Batas'};
 if(total.effective<=0)return {tone:'unset',icon:'📌',label:'Belum Dianggarkan'};
 if(total.remaining===0)return {tone:'warn',icon:'🔔',label:'Batas Tercapai'};
 if(total.remaining<=total.effective*.2)return {tone:'warn',icon:'🔔',label:'Menipis'};
 return {tone:'safe',icon:'🌱',label:'Aman'};
}
function budgetDetailSigned(value){
 return (value<0?'−':'+')+money(Math.abs(value));
}
function budgetDetailProgress(total,label){
 const initial=Math.max(0,total.initial),effective=Math.max(0,total.effective),used=Math.max(0,total.used);
 const state=budgetDetailUsageStatus(total),tone=budgetDetailChangeTone(total);
 // Angka selalu digambar pada skala yang sama: awal, efektif, pemakaian.
 // Saat melampaui batas, sediakan sedikit ruang di kanan untuk memperlihatkan kelebihannya.
 const over=used>effective,scale=Math.max(initial,effective,over?used*1.04:used,1);
 const percent=value=>(Math.min(100,Math.max(0,value/scale*100))).toFixed(3);
 const initialPct=percent(initial),limitPct=percent(effective),usedPct=percent(used);
 const regular=Math.min(used,effective),usedBase=Math.min(regular,initial);
 const extraStart=initial,extraAmount=Math.max(0,effective-initial);
 const consumedExtra=effective>initial?Math.max(0,regular-initial):0;
 const reducedAmount=Math.max(0,initial-effective);
 const overflowAmount=over?Math.max(0,used-effective):0;
 const remaining=Math.abs(total.remaining);
 const rate=effective>0?Math.max(0,used/effective*100):null;
 const usageText=rate===null?'Belum ada batas positif':Math.round(rate).toLocaleString('id-ID')+'% terpakai';
 const remainingText=total.remaining<0?'Melebihi':total.remaining===0?'Tepat batas':'Sisa';
 const aria='Pemakaian '+label+': terpakai '+money(total.used)+', anggaran awal '+money(total.initial)+
  ', anggaran efektif '+money(total.effective)+', '+usageText+
  (total.change===0?', tidak berubah':', '+(total.change>0?'bertambah ':'berkurang ')+money(Math.abs(total.change)));
 return `<div class="budget-detail-chart-wrap tone-${tone} state-${state.tone} ${over?'is-over':''}">
  <div class="budget-detail-progress-head">
   <span class="budget-detail-used-text">💸 Sudah digunakan <strong>${money(total.used)}</strong></span>
   <span class="budget-detail-limit-pill">🚩 Batas ${money(total.effective)}</span>
  </div>
  <div class="budget-detail-chart" role="progressbar" aria-label="${h(aria)}"
   aria-valuemin="0" aria-valuemax="100" aria-valuenow="${rate===null?0:Math.min(100,Math.round(rate))}"
   aria-valuetext="${h(usageText)}">
   <span class="budget-detail-chart-base" aria-hidden="true"></span>
   ${extraAmount>0?`<span class="budget-detail-chart-added" aria-hidden="true"
      style="left:${initialPct}%;width:${percent(extraAmount)}%"></span>`:''}
   ${reducedAmount>0?`<span class="budget-detail-chart-reduced" aria-hidden="true"
      style="left:${limitPct}%;width:${percent(reducedAmount)}%"></span>`:''}
   ${usedBase>0?`<span class="budget-detail-chart-used" aria-hidden="true"
      style="width:${percent(usedBase)}%"></span>`:''}
   ${consumedExtra>0?`<span class="budget-detail-chart-used-extra" aria-hidden="true"
      style="left:${initialPct}%;width:${percent(consumedExtra)}%"></span>`:''}
   ${overflowAmount>0?`<span class="budget-detail-chart-overrun" aria-hidden="true"
      style="left:${limitPct}%;width:${percent(overflowAmount)}%"></span>`:''}
   ${tone!=='steady'&&initial>0?`<span class="budget-detail-chart-initial-marker"
      aria-hidden="true" style="left:${initialPct}%"></span>`:''}
   ${effective>0?`<span class="budget-detail-chart-limit" aria-hidden="true"
      style="left:${limitPct}%"><i></i></span>`:''}
   ${used>0?`<span class="budget-detail-chart-dot" aria-hidden="true"
      style="left:${usedPct}%"></span>`:''}
  </div>
  <div class="budget-detail-chart-foot">
   <span class="budget-detail-usage-pill">${state.icon} ${usageText}</span>
   <span class="budget-detail-remaining-pill ${total.remaining<0?'is-over':total.remaining===0?'is-exact':'is-remaining'}">
    ${total.remaining<0?'🚨':total.remaining===0?'✓':'✨'} ${remainingText}
    ${total.remaining===0?'':`<b>${money(remaining)}</b>`}
   </span>
  </div>
 </div>`;
}

 if(!html)return toast('Data anggaran tidak ditemukan.',true);

function closeBudgetFlowDialog(restore=true){

 budgetPopupBackPosId=null;

/* Setelah popup anak disimpan, popup induk diperbarui dengan draft dan scroll yang tetap terjaga. */

let deleteDialogPending=null;
function askDelete(label,explanation,onConfirm,trigger=document.activeElement,onCancel=null){
 if(deleteDialogPending||typeof onConfirm!=='function')return;
 const backdrop=document.createElement('div');
 backdrop.id='paaxixi-delete-dialog';backdrop.className='paaxixi-delete-backdrop';
 backdrop.innerHTML='<div class="paaxixi-delete-card" role="alertdialog" aria-modal="true" aria-labelledby="delete-title" aria-describedby="delete-note">'+
  '<div class="paaxixi-delete-icon" aria-hidden="true">🗑️</div>'+
  '<h3 id="delete-title">Apakah kamu yakin?</h3>'+
  '<p>Catatan yang akan dihapus:</p>'+
  '<strong class="paaxixi-delete-label"></strong>'+
  '<p id="delete-note" class="paaxixi-delete-note"></p>'+
  '<div class="paaxixi-delete-actions">'+
  '<button type="button" data-delete-choice="cancel">Batal</button>'+
  '<button type="button" class="paaxixi-delete-yes" data-delete-choice="yes">Yakin, Hapus</button>'+
  '</div></div>';
 backdrop.querySelector('.paaxixi-delete-label').textContent=label;
 backdrop.querySelector('.paaxixi-delete-note').textContent=explanation;
 deleteDialogPending={onConfirm,trigger};
 const complete=yes=>{
  const old=deleteDialogPending;
  if(!old)return;
  deleteDialogPending=null;backdrop.remove();
  if(yes){old.onConfirm();return;}
  if(old.trigger?.isConnected)old.trigger.focus({preventScroll:true});
  if(typeof onCancel==='function')onCancel();
 };
 backdrop.addEventListener('click',event=>{
  event.stopPropagation();
  const button=event.target.closest('[data-delete-choice]');
  if(button){complete(button.dataset.deleteChoice==='yes');return;}
  if(event.target===backdrop)complete(false);
 });
 backdrop.addEventListener('keydown',event=>{
  event.stopPropagation();
  if(event.key==='Escape'){event.preventDefault();complete(false);return;}
  if(event.key==='Tab'){
   const controls=[...backdrop.querySelectorAll('.paaxixi-delete-actions button')];
   if(event.shiftKey&&document.activeElement===controls[0]){event.preventDefault();controls[1].focus();}
   else if(!event.shiftKey&&document.activeElement===controls[1]){event.preventDefault();controls[0].focus();}
  }
 });
 document.body.appendChild(backdrop);
 backdrop.querySelector('[data-delete-choice="cancel"]')?.focus({preventScroll:true});
}
function confirmDelete(question){
 return new Promise(resolve=>{
  const label=String(question||'Catatan ini').replace(/^Hapus\s+/i,'').replace(/\?$/,'').trim();
  askDelete(label,'Data yang sudah dihapus tidak bisa dipulihkan tanpa cadangan.',()=>resolve(true),document.activeElement,()=>resolve(false));
 });
}

function parseAmount(value){
 const raw=String(value??'').trim();
 if(!/^(?:\d+|\d{1,3}(?:\.\d{3})+)(?:,\d{1,2})?$/.test(raw))return NaN;
 const n=Number(raw.replace(/\./g,'').replace(',','.'));
 return Number.isFinite(n)&&Math.abs(n)<=Number.MAX_SAFE_INTEGER/100?Math.round(n*100)/100:NaN;
}
const integer=v=>parseAmount(v);
const positive=v=>{let n=parseAmount(v);return Number.isFinite(n)&&n>0?n:null};
function formatRupiahInput(raw){
 let s=String(raw??'').replace(/[^\d,]/g,'');if(!s)return '';
 const comma=s.indexOf(','),hasDecimal=comma!==-1;
 let whole=(hasDecimal?s.slice(0,comma):s)||'0';
 whole=whole.replace(/^0+(?=\d)/,'');
 const decimal=hasDecimal?s.slice(comma+1).replace(/,/g,'').slice(0,2):'';
 return whole.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(hasDecimal?','+decimal:'');
}
function rupiahInputHandler(e){
 const el=e.target;if(!el.matches?.('input[data-rupiah]'))return;
 const old=el.value,pos=el.selectionStart??old.length;
 const logical=old.slice(0,pos).replace(/[^\d,]/g,'').length;
 const next=formatRupiahInput(old);el.value=next;
 let cursor=0,count=0;
 while(cursor<next.length&&count<logical){if(/[\d,]/.test(next[cursor]))count++;cursor++;}
 el.setSelectionRange(cursor,cursor);
}

function reviewExportData(){
 const type=ui.reviewType==='income'?'income':'expense';
 const items=monthly().filter(t=>t.type===type).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
 const label=type==='income'?'Pemasukan':'Pengeluaran';
 const columns=['Tanggal','Nama Transaksi','Kelompok','Kategori','Rekening','Nominal (Rp)','Catatan'];
 const rows=items.map(t=>[t.date||'',t.title||'',t.group||cat(t.categoryId)?.group||'',
  t.categoryLabel||cat(t.categoryId)?.label||'',t.accountLabel||acc(t.accountId)?.name||'',num(t.amount),t.note||'']);
 return {month:ui.month,period:monthFmt(ui.month),label,columns,rows,total:items.reduce((n,t)=>n+num(t.amount),0)};
}
function reviewExportCSV(data){
 const quoted=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
 return '\ufeff'+[data.columns,...data.rows].map(row=>row.map(quoted).join(',')).join('\r\n');
}

 if(!wrap||!menu||!button)return;
 menu.hidden=true;wrap.classList.remove('open');button.setAttribute('aria-expanded','false');

function reviewPDFString(x){

  .replace(/[^\x20-\x7e]/g,' ').replace(/\s+/g,' ').trim();
}
function reviewPDFWrap(value,max=30){
 const words=reviewPDFString(value).split(' '),out=[];let line='';
 for(const w of words){
  if(!w)continue;
  if(w.length>max){if(line){out.push(line);line='';}for(let i=0;i<w.length;i+=max)out.push(w.slice(i,i+max));}
  else if(line&&line.length+1+w.length>max){out.push(line);line=w;}
  else line+=(line?' ':'')+w;
 }
 if(line)out.push(line);return out.length?out:[''];
}

<script>
/* Brand doodle: bagi teks menjadi huruf yang menari dengan waktu berbeda.
   Tidak mengubah data transaksi, Firebase, atau menu. */
(()=>{
 const tilt=[-4,2,-2,4,-1,3,-3,1,4,-2];
 document.querySelectorAll('[data-paaxixi-letters]').forEach((word,wordIndex)=>{
  const original=word.textContent||'';
  const fragment=document.createDocumentFragment();
  Array.from(original).forEach((char,i)=>{
   const letter=document.createElement('span');
   letter.className='paaxixi-letter';
   letter.textContent=char;
   const seed=i+wordIndex*13;
   letter.style.setProperty('--paaxixi-angle',tilt[seed%tilt.length]+'deg');
   letter.style.setProperty('--paaxixi-duration',(7.4+(seed%7)*.55)+'s');
   letter.style.setProperty('--paaxixi-delay',(-.33*(seed%17)-.9)+'s');
   fragment.appendChild(letter);
  });
  word.replaceChildren(fragment);
 });
})();
</script>
<script id="composition-v8-script">
/* Duit-Duit Paaxixi — komposisi chart v7.
   Legend kelompok berada di tombol pemilih atas; irisan memakai label langsung.
   Tidak menulis/mengubah transaksi, rekening, filter, atau cloud. */
(()=>{
 'use strict';
 const get=(root,selector)=>root?.querySelector(selector);
 const getAll=(root,selector)=>[...(root?.querySelectorAll(selector)||[])];
 const money=value=>'Rp'+Math.round(value||0).toLocaleString('id-ID');
 const compact=value=>value>=1e9?'Rp'+(value/1e9).toLocaleString('id-ID',{maximumFractionDigits:1})+' M':
  value>=1e6?'Rp'+(value/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt':
  value>=1e3?'Rp'+(value/1e3).toLocaleString('id-ID',{maximumFractionDigits:0})+' rb':money(value);
 const node=(tag,cls,txt)=>{
  const el=document.createElement(tag);
  if(cls)el.className=cls;
  if(txt!==undefined)el.textContent=txt;
  return el;
 };
 const vector=(tag,attrs={})=>{
  const el=document.createElementNS('http://www.w3.org/2000/svg',tag);
  Object.entries(attrs).forEach(([key,value])=>el.setAttribute(key,String(value)));
  return el;
 };
 const xy=(deg,r,cx,cy)=>{
  const theta=(deg-90)*Math.PI/180;
  return {x:cx+r*Math.cos(theta),y:cy+r*Math.sin(theta)};
 };
 function arc(from,to,r,cx,cy){
  const size=to-from,trim=Math.min(.6,size*.16);
  let a=from+trim,b=to-trim;if(b-a>=359.9)b=a+359.75;
  const first=xy(a,r,cx,cy),last=xy(b,r,cx,cy);
  return 'M '+first.x.toFixed(2)+' '+first.y.toFixed(2)+
   ' A '+r+' '+r+' 0 '+(b-a>180?'1':'0')+' 1 '+last.x.toFixed(2)+' '+last.y.toFixed(2);
 }
 function enhance(){
  const card=document.getElementById('composition-card');
  if(!card||card.dataset.liveChart==='ready')return;
  const distribution=get(card,'.comp-distribution');
  const legend=get(card,'.comp-donut-legend');
  if(!distribution||!legend)return;
  const rows=getAll(legend,'.comp-legend-item').map(item=>({
   name:get(item,'.comp-legend-name')?.textContent?.trim()||'Kategori',
   icon:get(item,'.category-symbol')?.textContent?.trim()||'🏷️',
   amount:Number((get(item,'.comp-legend-amount')?.textContent||'0').replace(/[^0-9]/g,''))||0,
   color:item.dataset.compColor||'#2563eb'
  })).filter(item=>item.amount>0);
  if(!rows.length)return;
  card.dataset.liveChart='ready';
  const total=rows.reduce((acc,item)=>acc+item.amount,0);
  const selectedGroup=!!get(card,'.comp-direct-groups .comp-group-colored[aria-pressed="true"]');
  const stage=node('div','comp-recap-stage');
  stage.setAttribute('aria-label',selectedGroup?'Komposisi per pos di kelompok terpilih':'Komposisi per kelompok pengeluaran');
  const desktop=node('div','comp-recap-wide');
  const mobile=node('div','comp-recap-narrow');
  const left=[],right=[];
  let angle=0;
  const figures=rows.map((item,index)=>{
   const start=angle,span=item.amount/total*360;angle+=span;
   const midpoint=start+span/2;
   const side=Math.sin((midpoint)*Math.PI/180)>=0?'right':'left';
   const figure={...item,index,start,end:angle,mid:midpoint,side,percentage:Math.round(item.amount/total*100)};
   (side==='right'?right:left).push(figure);
   return figure;
  });
  const maxItems=Math.max(left.length,right.length);
  const height=Math.max(315,Math.round(maxItems*56+56));
  // Cincin diperbesar tanpa memotong callout dan connector.
  const cx=320,cy=height/2,radius=117;
  const canvas=vector('svg',{viewBox:'0 0 640 '+height,role:'group',
   'aria-label':'Donut dengan label nominal dan persentase untuk setiap '+(selectedGroup?'pos':'kelompok')});
  // Pisahkan cincin donut dari garis/label agar animasi tidak menggeser legend.
  const track=vector('circle',{cx,cy,r:radius,fill:'none',stroke:'#e8effa','stroke-width':36});
  const motionLayer=vector('g',{class:'comp-recap-ring-motion'});
  motionLayer.style.setProperty('--donut-center-y',cy+'px');
  const depthLayer=vector('g',{class:'comp-recap-ring-depth','aria-hidden':'true'});
  const connectorLayer=vector('g',{class:'comp-recap-connectors'});
  const arcLayer=vector('g',{class:'comp-recap-arcs'});
  const shineLayer=vector('g',{class:'comp-recap-ring-shine','aria-hidden':'true'});
  const shimmer=vector('circle',{cx,cy,r:radius,fill:'none',stroke:'#fff',
   'stroke-width':30,'stroke-dasharray':'29 720','stroke-linecap':'round',
   class:'comp-recap-glint'});
  shineLayer.append(shimmer);
  motionLayer.append(track,depthLayer,arcLayer,shineLayer);
  const labelLayer=vector('g',{class:'comp-recap-labels'});
  canvas.append(motionLayer,connectorLayer,labelLayer);
  const center=node('div','comp-recap-center');
  const value=node('strong','',money(total));center.append(value);
  desktop.append(canvas,center);
  // A responsive donut and a narrow adjacent annotation rail for phone widths.
  const smallRing=node('div','comp-recap-small-ring');
  const smallSvg=vector('svg',{viewBox:'0 0 240 240',role:'group','aria-label':'Grafik komposisi interaktif'});
  smallSvg.append(vector('circle',{cx:120,cy:120,r:95,fill:'none',stroke:'#e8effa','stroke-width':34}));
  const smallCenter=node('div','comp-recap-small-center');
  const smallValue=node('strong','',money(total));smallCenter.append(smallValue);
  smallRing.append(smallSvg,smallCenter);
  const smallRail=node('div','comp-recap-rail');smallRail.setAttribute('aria-label','Label persentase dan nominal di sisi donut');
  mobile.append(smallRing,smallRail);
  stage.append(desktop,mobile);
  const shapes=[],labels=[],mobileLabels=[];
  let locked=-1;
  function paint(index){
   const chosen=index>=0?figures[index]:null;
   const current=chosen?chosen.amount:total,full=money(current),digits=full.length;
   value.textContent=full;smallValue.textContent=full;
   value.style.fontSize=(digits>18?11:digits>15?12:digits>12?15:19)+'px';
   smallValue.style.fontSize=(digits>18?10:digits>15?11:digits>12?12:15)+'px';
   canvas.classList.toggle('is-exploring',!!chosen);
   smallSvg.classList.toggle('is-exploring',!!chosen);
   shapes.forEach(({wide,narrow},i)=>{
    for(const path of [wide,narrow]){
     path.classList.toggle('is-active',i===index);
     path.setAttribute('aria-pressed',String(i===locked));
    }
   });
   labels.forEach((el,i)=>{el.classList.toggle('is-active',i===index);el.setAttribute('aria-pressed',String(i===locked));});
   mobileLabels.forEach((el,i)=>{el.classList.toggle('is-active',i===index);el.setAttribute('aria-pressed',String(i===locked));});
  }
  const choose=index=>{card.dispatchEvent(new CustomEvent('paax:expense-pie-detail',{bubbles:true,detail:{index}}));};
  function connect(el,index){
   el.dataset.compPieDetail=String(index);
   el.addEventListener('mouseenter',()=>paint(index));
   el.addEventListener('mouseleave',()=>paint(locked));
   el.addEventListener('focus',()=>paint(index));
   el.addEventListener('blur',()=>paint(locked));
   el.addEventListener('click',()=>choose(index));
   if(el.namespaceURI==='http://www.w3.org/2000/svg'){
    el.addEventListener('keydown',event=>{
     if(event.key==='Enter'||event.key===' '){event.preventDefault();choose(index);}
    });
   }
  }
  figures.forEach((entry,i)=>{
   const props={stroke:entry.color,fill:'none',role:'button',tabindex:0,
    'aria-label':entry.name+', '+entry.percentage+' persen, '+money(entry.amount),
    'aria-pressed':'false'};
   const ringPath=arc(entry.start,entry.end,radius,cx,cy);
   const depth=vector('path',{d:ringPath,stroke:entry.color,fill:'none',
    class:'comp-recap-depth-arc','aria-hidden':'true'});
   depthLayer.append(depth);
   const wide=vector('path',{...props,d:ringPath,class:'comp-recap-arc'});
   const mobilePath=vector('path',{...props,d:arc(entry.start,entry.end,95,120,120),class:'comp-recap-arc'});
   const push=xy(entry.mid,4,0,0);
   wide.style.setProperty('--recap-push-x',push.x.toFixed(2)+'px');
   wide.style.setProperty('--recap-push-y',push.y.toFixed(2)+'px');
   mobilePath.style.setProperty('--recap-push-x',push.x.toFixed(2)+'px');
   mobilePath.style.setProperty('--recap-push-y',push.y.toFixed(2)+'px');
   wide.style.setProperty('--recap-delay',i*65+'ms');
   mobilePath.style.setProperty('--recap-delay',i*65+'ms');
   arcLayer.append(wide);smallSvg.append(mobilePath);
   shapes.push({wide,narrow:mobilePath});
   connect(wide,i);connect(mobilePath,i);
   const mini=node('button','comp-recap-rail-label');
   mini.type='button';mini.setAttribute('aria-pressed','false');mini.style.setProperty('--recap-color',entry.color);
   const top=node('span','comp-recap-rail-name',entry.icon+' '+entry.name);
   const detail=node('span','comp-recap-rail-data',entry.percentage+'% · '+money(entry.amount));
   mini.append(top,detail);mini.setAttribute('aria-label',entry.name+', '+entry.percentage+' persen, '+money(entry.amount));
   smallRail.append(mini);mobileLabels.push(mini);connect(mini,i);
  });
  // Label seperti referensi: kotak ringkas di kiri/kanan, dengan garis pendek
  // lurus dari tepi warna irisan yang bersangkutan.
  // Hanya geser label bila berpotensi bertumpuk, tanpa garis liar di luar diagram.
  for(const list of [left,right]){
   const margin=27,minGap=55;
   const entries=list.map(entry=>({
    entry,
    source:xy(entry.mid,radius+16,cx,cy)
   })).sort((a,b)=>a.source.y-b.source.y);
   if(!entries.length)continue;
   const slots=entries.map(p=>Math.max(margin,Math.min(height-margin,p.source.y)));
   for(let i=1;i<slots.length;i++)slots[i]=Math.max(slots[i],slots[i-1]+minGap);
   if(slots[slots.length-1]>height-margin){
    const overflow=slots[slots.length-1]-(height-margin);
    for(let i=0;i<slots.length;i++)slots[i]-=overflow;
   }
   if(slots[0]<margin){
    const correction=margin-slots[0];
    for(let i=0;i<slots.length;i++)slots[i]+=correction;
   }
   entries.forEach(({entry,source},j)=>{
    const x=entry.side==='left'?7:471,slot=slots[j];
    const edgeX=entry.side==='left'?x+162:x;
    const direction=entry.side==='left'?-1:1;
    const startX=source.x.toFixed(2),startY=source.y.toFixed(2);
    const endY=slot.toFixed(2);
    // Umumnya horizontal sempurna. Saat label bergeser, hanya sambungkan
    // dengan diagonal pendek lalu garis horizontal; tidak ada siku radial panjang.
    const diff=Math.abs(source.y-slot);
    const bendX=(source.x+direction*Math.min(22,Math.max(12,diff*.7))).toFixed(2);
    const pathData=diff<2.5?
     'M '+startX+' '+startY+' H '+edgeX:
     'M '+startX+' '+startY+' L '+bendX+' '+endY+' H '+edgeX;
    connectorLayer.append(
     vector('path',{
      d:pathData,stroke:entry.color,fill:'none','stroke-width':1.45,
      'stroke-linecap':'round','stroke-linejoin':'round',opacity:.78,
      'pointer-events':'none'
     })
    );
    const g=vector('g',{
     class:'comp-recap-callout',role:'button',tabindex:0,'aria-pressed':'false',
     'aria-label':entry.name+', '+entry.percentage+' persen, '+money(entry.amount)
    });
    g.style.setProperty('--recap-color',entry.color);
    const plate=vector('rect',{
     x,y:slot-24,width:162,height:48,rx:12,
     fill:'#f9fbff',stroke:entry.color,'stroke-opacity':.5,'stroke-width':1.2
    });
    const name=vector('text',{
     x:x+10,y:slot-6,class:'comp-recap-callout-name',fill:entry.color
    });
    name.textContent=entry.icon+' '+entry.name;
    const detail=vector('text',{
     x:x+10,y:slot+13,class:'comp-recap-callout-data',fill:entry.color
    });
    detail.textContent=entry.percentage+'% · '+money(entry.amount);
    g.append(plate,name,detail);
    labelLayer.append(g);
    labels[entry.index]=g;
    connect(g,entry.index);
   });
  }
  distribution.replaceWith(stage);
  get(card,'.comp-insight')?.remove();
  get(card,'.comp-live-intro')?.remove();
  get(card,'.comp-live-mini')?.remove();
  paint(-1);
 }
 function init(){
  const content=document.getElementById('content');if(!content)return;
  const observer=new MutationObserver(enhance);observer.observe(content,{childList:true});
  enhance();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});
 else init();
})();
</script>

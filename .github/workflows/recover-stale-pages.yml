name: Repair Pages publishing source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-stale-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  reset-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reaffirm main root Pages build configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          HEADERS=(-H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Authorization: Bearer $GH_TOKEN")
          echo "Attempting non-destructive Pages configuration refresh..."
          code=$(curl -sS -L "${HEADERS[@]}" -X PUT "$BASE" -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}' -o /tmp/pages-result -w '%{http_code}')
          echo "Config update HTTP: $code"
          if [[ "$code" != "204" ]]; then
            cat /tmp/pages-result
            echo "::error::Pages Settings require account-level Administration permission unavailable to GitHub Actions. No site settings were changed."
            exit 1
          fi
          echo "Pages source refreshed; requesting a new build..."
          code=$(curl -sS -L "${HEADERS[@]}" -X POST "$BASE/builds" -o /tmp/pages-build -w '%{http_code}')
          echo "Build request HTTP: $code"
          if [[ "$code" != "201" && "$code" != "202" ]]; then cat /tmp/pages-build; exit 1; fi
